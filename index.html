<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Essentials · Подготовка к финалу</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f8;--bg2:#f1ebff;--card:rgba(255,255,255,.82);--ink:#4b3a55;--mut:#8c7b96;--rose:#f6a9c0;--rosed:#d77a9d;--lav:#d4c3f3;--lavd:#8b6fc7;--mint:#c4ebd8;--mintd:#43987a;--peach:#ffdccb;--bad:#f3b0b8;--badd:#c4586a;--line:#f0dfe8;--sh:0 8px 28px rgba(190,140,175,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2132;--bg2:#241d33;--card:rgba(58,46,70,.85);--ink:#f3e8f6;--mut:#b9a7c4;--rose:#c76f93;--rosed:#f2a2c0;--lav:#5a4685;--lavd:#c9b4f2;--mint:#2f5848;--mintd:#8fdcbc;--peach:#5b4040;--bad:#6b3a45;--badd:#ffa9b5;--line:#4a3a58;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2132;--bg2:#241d33;--card:rgba(58,46,70,.85);--ink:#f3e8f6;--mut:#b9a7c4;--rose:#c76f93;--rosed:#f2a2c0;--lav:#5a4685;--lavd:#c9b4f2;--mint:#2f5848;--mintd:#8fdcbc;--peach:#5b4040;--bad:#6b3a45;--badd:#ffa9b5;--line:#4a3a58;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);background-image:radial-gradient(520px 380px at 8% 0%,var(--peach),transparent 70%),radial-gradient(560px 420px at 100% 12%,var(--bg2),transparent 70%),radial-gradient(500px 400px at 50% 100%,var(--lav),transparent 75%);background-attachment:fixed;font:16px/1.55 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:14px 16px 56px}
h1,h2,h3{margin:0;line-height:1.2}
.script{font-family:"Caveat","Segoe Script",cursive;font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:2px 0 18px}
nav button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;color:var(--ink);background:var(--card);box-shadow:var(--sh);transition:transform .15s}
nav button:hover,.btn:hover{transform:translateY(-2px)}
nav button.on{background:linear-gradient(135deg,var(--rose),var(--lav));color:#fff}
.btn.p{background:linear-gradient(135deg,var(--rose),var(--lav));color:#fff}.btn.g{background:var(--mint);color:var(--mintd)}.btn.w{background:var(--peach)}.btn[disabled]{opacity:.5;cursor:default;transform:none}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:18px;backdrop-filter:blur(6px);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s}.tcard:hover{transform:translateY(-3px)}
.tcard .em{font-size:1.7rem}.tcard b{display:block;margin:4px 0 2px}.tcard small{color:var(--mut)}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--rose),var(--lavd));transition:width .4s}
.hero{text-align:center;padding:8px 0 4px}
.heart{width:min(420px,88vw);margin:0 auto;display:block;filter:drop-shadow(0 12px 22px rgba(215,122,157,.35));animation:beat 2.6s ease-in-out infinite;transform-origin:50% 60%}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.035)}24%{transform:scale(1)}36%{transform:scale(1.025)}48%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.heart{animation:none}}
.hero h1{font-size:2.5rem;color:var(--rosed);margin-top:6px}.hero p{color:var(--mut);margin:4px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.wish{font-size:1.15rem;line-height:1.5}.wish .script{font-size:1.9rem;color:var(--rosed);display:block;margin-bottom:4px}
audio{width:100%;margin-top:10px;border-radius:999px}
.sec{margin:26px 0 10px;font-weight:800;color:var(--lavd);letter-spacing:.04em;text-transform:uppercase;font-size:.85rem}
.meta{color:var(--mut);font-size:.9rem;margin-bottom:6px}
.q h3{font-size:1.2rem;margin:6px 0 14px;font-weight:800}
.o{display:block;width:100%;text-align:left;font:inherit;color:inherit;margin:8px 0;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;transition:.15s}
.o:hover:not([disabled]){border-color:var(--rose)}.o.sel{border-color:var(--lavd);background:var(--bg2)}.o.ok{border-color:var(--mintd);background:var(--mint)}.o.no{border-color:var(--badd);background:var(--bad)}.o[disabled]{cursor:default}
.ex{margin-top:14px;padding:14px;border-radius:16px;background:var(--bg2);border:1px dashed var(--lav)}.ex b{color:var(--lavd)}.ex .en{display:block;margin-top:8px;color:var(--mut);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.big{font-size:3rem;font-weight:800;color:var(--rosed);text-align:center}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.dots button{width:28px;height:28px;border-radius:9px;border:0;font:inherit;font-size:.75rem;cursor:pointer;background:var(--line);color:var(--ink)}.dots .a{background:var(--lav)}.dots .c{outline:2px solid var(--rosed)}
.flip{perspective:1000px;margin:10px 0}.fc{position:relative;min-height:290px;transition:transform .55s;transform-style:preserve-3d;cursor:pointer}.fc.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:22px;display:flex;flex-direction:column;justify-content:center;overflow:auto;box-shadow:var(--sh);border:1px solid var(--line)}
.face.fr{background:var(--card)}.face.bk{background:linear-gradient(160deg,var(--mint),var(--bg2));transform:rotateY(180deg)}
.face .hint{color:var(--mut);font-size:.85rem;margin-top:10px}
select{font:inherit;padding:9px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:800}.pill.ok{background:var(--mint);color:var(--mintd)}.pill.no{background:var(--bad);color:var(--badd)}
.rev{margin:10px 0;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
a.lnk{color:var(--lavd);cursor:pointer;text-decoration:underline}
footer{text-align:center;color:var(--mut);margin-top:30px}
</style></head><body><main id="app"></main>
<script>
const DATA={"Q":[{"i":"1a","g":0,"q":"In which situation would an ESD strike potentially cause harm to the PC?","o":["when replacing a mechanical hard drive with an M.2 SSD","when installing an additional display in a workplace cubicle","when using a grounded mat and working on a computer on an ungrounded workbench","when installing a dual-voltage power supply"],"a":[0],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"1b","g":0,"q":"In which situation would an ESD strike potentially cause harm to the PC?","o":["when installing an additional display in a workplace cubicle","when replacing high voltage laser printer parts","while attaching speakers to a surround sound card","when installing a UPS","when installing RAM"],"a":[4],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":"Minimize the risk of electrostatic discharge. Whenever 2 things touch, there is always an exchange of electrons at the atomic level. Most of the time, this exchange is so negligible that you don't notice it, but even tiny bolts of static electricity can fry your RAM modules. In fact, any electrical component in your computer has a chance to be damaged by static electricity."},{"i":"2a","g":0,"q":"A person has started a new technical job. In which situation would ESD be an issue?","o":["when installing a processor","when using a grounded mat and working on a computer on an ungrounded workbench","when installing a dual-voltage power supply","while exchanging one laptop AC adapter with one that is not from the original equipment manufacturer"],"a":[0],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"2b","g":0,"q":"A person has started a new technical job. In which situation would ESD be an issue?","o":["when installing RAM","when installing an additional display in a workplace cubicle","when replacing high voltage laser printer parts","while attaching speakers to a surround sound card"],"a":[0],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"3","g":11,"q":"A technician is about to begin preventive maintenance on a company PC. In which situation would ESD be an issue?","o":["when replacing a motherboard","while attaching speakers to a surround sound card","when using a grounded mat and working on a computer on an ungrounded workbench","when installing a dual-voltage power supply"],"a":[0],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"4a","g":0,"q":"An instructor has given a student an assignment to assemble a PC. In which situation should the student be aware that ESD is an issue?","o":["when installing RAM","when working in a corporate environment that has carpet installed under tower PCs","when using a grounded mat and working on a computer on an ungrounded workbench","when installing a dual-voltage power supply"],"a":[0],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"4b","g":11,"q":"An instructor has given a student an assignment to assemble a PC. In which situation should the student be aware that ESD is an issue?","o":["when walking across a carpeted area and then touching a keyboard that is attached to a tower PC","when installing a UPS","when working in a corporate environment that has carpet installed under tower PCs","when replacing a mechanical hard drive with an M.2 SSD"],"a":[0],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"4c","g":0,"q":"An instructor has given a student an assignment to assemble a PC. In which situation should the student be aware that ESD is an issue?","o":["when using a grounded mat and working on a computer on an ungrounded workbench","when working in a corporate environment that has carpet installed under tower PCs","when installing a processor","when walking across a carpeted area and then touching a keyboard that is attached to a tower PC"],"a":[3],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"5","g":8,"q":"What two motherboard components control the system boot operations? (Choose two.)","o":["BIOS chip","UEFI chip","Northbridge chip","Southbridge chip","CPU"],"a":[0,1],"e":"","s":"System boot services are provided by the motherboard BIOS and UEFI chips."},{"i":"6","g":1,"q":"A technician is upgrading an ATX motherboard with another ATX motherboard. Which component might be affected by this and need to be upgraded and bought as an additional purchase?","o":["BIOS","chipset","CMOS battery","CPU","PCIe adapter"],"a":[3],"e":"","s":"The motherboard, CPU, and power supply must be compatible."},{"i":"7","g":0,"q":"A customer has requested that a PC be built that will support eSATA. Which component should be checked to be sure that this feature is supported?","o":["CPU","chipset","hard disk","RAM module"],"a":[1],"e":"","s":"The chipset on a motherboard consists of integrated circuits that control how system hardware interacts with the CPU and motherboard. It also provides the capability and features needed, such as the maximum memory supported on the motherboard, multiple USB ports, eSATA connections, surround sound, and video."},{"i":"8","g":0,"q":"Which memory module used to hold instructions for booting a PC and loading the OS, but is still used on adapters even though the memory contents cannot be changed?","o":["RAM","ROM","cache","main memory"],"a":[1],"e":"ROM — постоянная память: хранит загрузочные инструкции, содержимое не меняется и не пропадает без питания (прошивка плат).","s":""},{"i":"9","g":0,"q":"What is a characteristic of DDR SDRAM?","o":["It transfers data twice per clock cycle compared to once per clock cycle for SDRAM.","DDR SDRAM modules have double the number of pins of SDRAM memory modules.","It is dynamic memory whereas SDRAM is static memory.","It operates at double the voltage of SDRAM memory."],"a":[0],"e":"","s":"DDR SDRAM transfers data twice per clock cycle, whereas SDRAM transfers data once each clock cycle. Both DDR SDRAM and SDRAM are forms of dynamic memory. The difference in data transfer rate between DDR SDRAM and SDRAM is not determined by the number of pins, nor the operating voltage."},{"i":"10","g":6,"q":"What are two safety hazards when dealing with laser printers? (Choose two.)","o":["high voltage","hot components","heavy metals","proprietary power bricks","unwieldy card cages"],"a":[0,1],"e":"","s":"Laser printers require high voltage when initially powered on and to charge the drum in preparation for writing data to the drum. This high voltage requirement is why most laser printers are not normally connected to a UPS. A laser printer also has a fuser assembly used to apply heat and pressure to the toner to permanently attach it to the paper. The laser printer must be unplugged and the fuser assembly must be allowed to cool before working inside the printer."},{"i":"11","g":0,"q":"Which component requires a technician to install screws externally through the PC case?","o":["RAM","CPU","motherboard","power supply"],"a":[3],"e":"","s":"The power supply commonly has four screws that attach from outside the case through case holes into screw holes on the power supply."},{"i":"12","g":0,"q":"A technician is installing an internal HDD. To which motherboard connector will the technician connect the data cable?","o":["ATX","PCI","PWR_SW","SATA"],"a":[3],"e":"","s":"Internal hard drives are commonly SATA drives that have a data cable that extends from the drive to a motherboard SATA connector.."},{"i":"14","g":0,"q":"When a PC is being assembled, what component is connected to the motherboard with a SATA cable?","o":["the optical drive","the network interface card","the video card","the power supply"],"a":[0],"e":"","s":"SATA cables, or serial ATA cables, are used to carry data from drives to the motherboard."},{"i":"15","g":1,"q":"A technician is troubleshooting a computer that is experiencing hardware failure detected by the BIOS. What is one way this failure is indicated?","o":["The computer automatically boots into Safe Mode and displays a warning on the screen.","The screen flashes with a red background and displays a warning message.","The computer emits a pattern of beeps indicating the failing device.","The computer returns an error message that indicates the I/O address of the failing device."],"a":[2],"e":"","s":"Beep codes are a result of POST and these vary between computer vendors based on what BIOS is installed."},{"i":"16","g":1,"q":"Which three features can be configured in the BIOS settings to secure a computer? (Choose three.)","o":["MAC filtering","drive encryption","TPM","file encryption","TKIP key","passwords"],"a":[1,2,5],"e":"","s":"Passwords, drive encryption, and TPM are BIOS configurable security features. File encryption, TKIP key, and MAC filtering are security features not configured within BIOS."},{"i":"17","g":0,"q":"What is the purpose of RAID adapters?","o":["to allow older PCI technology expansion slots to be used","to provide enhanced audio and graphic capabilities","to connect multiple storage devices for redundancy or speed","to connect peripheral devices to a PC to improve performance"],"a":[2],"e":"","s":"RAID 0 allows “striping” or writing data across two hard drives, but provides no redundancy. The other RAID versions provide redundancy."},{"i":"18","g":1,"q":"When a new motherboard is being installed, between which two components must thermal compound be applied? (Choose two.)","o":["CPU","RAM","chassis","heat sink","chipset","motherboard"],"a":[0,3],"e":"","s":"You must apply thermal compound between the new CPU and the heat sink/fan assembly to avoid overheating the CPU. The thermal paste helps to conduct heat from the CPU to the heat sink."},{"i":"19","g":1,"q":"What is the purpose of a Safety Data Sheet?","o":["to specify procedures for dealing with potentially hazardous materials","to specify procedures in designing and building common computer systems","to specify procedures for the operation of sensitive components and prevention of electrostatic discharge","to specify procedures in the use of humidity control and prevention of moisture damage"],"a":[0],"e":"","s":"A Safety Data Sheet is a fact sheet that summarizes information about material identification, including hazardous ingredients that can affect personal health, fire hazards, and first-aid requirements. The SDS explains how to dispose of potentially hazardous materials in the safest manner."},{"i":"20","g":2,"q":"Which negative environmental factor does cleaning the inside of a computer reduce?","o":["dust","EMI","rust","ESD"],"a":[0],"e":"","s":"Accumulated dust inside the computer can prevent the flow of air and can hinder cooling."},{"i":"21","g":2,"q":"What is a recommended procedure to follow when cleaning computer components?","o":["Remove the CPU before cleaning.","Blow compressed air on cooling fans so that they will spin when dust is being removed.","Use window cleaner on LCD screens.","Hold cans of compressed air upright while spraying."],"a":[3],"e":"","s":"When using compressed air, keep the can upright to prevent the fluid from leaking onto computer components."},{"i":"22","g":2,"q":"On the production floor, a furniture plant has laptops for process monitoring and reporting. The production floor environment is around 80 degrees Fahrenheit (27 degrees Celsius). The humidity level is fairly high around 70 percent. Fans are mounted in the ceiling for air circulation. Wood dust is prevalent. Which condition is most likely to adversely affect a laptop that is used in this environment?","o":["the temperature","the humidity","the air flow","the dust"],"a":[3],"e":"","s":"Most laptops are created to be tolerant of a wide range of humidity levels and room temperatures. Dust, however, can cause overheating and failures."},{"i":"23","g":2,"q":"After a technician tests a theory of probable causes, what two actions should the technician take if the testing did not identify an exact cause? (Choose two.)","o":["Establish a new theory of probable causes.","Randomly replace components one at a time until the problem is solved.","Document each test tried that did not correct the problem.","Verify full system functionality.","Test all remaining possible causes starting with the most complex."],"a":[0,2],"e":"","s":"If the exact cause of the problem has not been determined after you have tested all your theories, establish a new theory of probable causes and test it."},{"i":"24","g":1,"q":"What would happen if a PC that contains a power supply that does not automatically adjust for input voltage is set to 230 volts and attaches to an outlet in the United States?","o":["The power supply would explode.","The PC would not turn on.","The PC would display an error code.","The PC would emit a series of beeps."],"a":[0],"e":"","s":"In the United States, the wall outlet electrical power is standardized at 120 volts AC."},{"i":"25","g":4,"q":"Which type of network spans a single building or campus and provides services and applications to people within a common organizational structure?","o":["PAN","WAN","LAN","MAN"],"a":[2],"e":"","s":"A LAN is smaller or more contained than a WAN, which can span several cities. A MAN is usually contained in one city. A PAN is a very small network of devices that are located in close proximity to one another, usually within range of a single person."},{"i":"26","g":4,"q":"What are two types of wired high-speed Internet connections? (Choose two.)","o":["cable","satellite","cellular","DSL","dial-up"],"a":[0,3],"e":"","s":"Cable and DSL Internet technologies both use physical cabling to provide an Internet connection to a residence or a small business. Although dial-up is a wired technology, it does not provide a high-speed Internet connection. Satellite and cellular connections provide a wireless Internet connection."},{"i":"27","g":3,"q":"In what two situations would UDP be better than TCP as the preferred transport protocol? (Choose two.)","o":["when applications need to guarantee that a packet arrives intact, in sequence, and unduplicated","when a faster delivery mechanism is needed","when delivery overhead is not an issue","when applications do not need to guarantee delivery of the data","when destination port numbers are dynamic"],"a":[1,3],"e":"","s":"UDP is a very simple transport layer protocol that does not guarantee delivery. Devices on both ends of the conversation are not required to keep track of the conversation. UDP is used as the transport protocol for applications that need a speedy, best-effort delivery."},{"i":"28","g":4,"q":"The current IP configuration of a small company is done manually and is time-consuming. Because of increased network growth, a technician needs a simpler way for IP configuration of workstations. Which service would simplify the workstation IP configuration task?","o":["APIPA","DHCP","DNS","ICMP"],"a":[1],"e":"","s":"In networks with more than a few hosts, DHCP simplifies the addressing process. A DHCP server automatically assigns host IP addresses."},{"i":"29","g":4,"q":"A company is looking for a next-generation firewall that provides VPN functionality, IDS/IPS functionality, and DoS/DDoS protection. Which device would be best suited for this task?","o":["multipurpose device","router","endpoint management server","UTM","TPM"],"a":[3],"e":"","s":"A universal threat management (UTM) device is a security device that can provide firewall, IDS/IPS, and proxy server functionality as well as email filtering and DoS/DDoS protection."},{"i":"30","g":4,"q":"A student is helping a friend with a home computer that can no longer access the Internet. Upon investigation, the student discovers that the computer has been assigned the IP address 169.254.100.88. What could cause a computer to get such an IP address?","o":["static IP addressing with incomplete information","interference from surrounding devices","reduced computer power supply output","unreachable DHCP server"],"a":[3],"e":"","s":"When a PC does not have a static IP address or cannot pick one up from a DHCP server, Windows will automatically assign the PC an IP address using APIPA, that uses the range of addresses 169.254.0.0 to 169.254.255.255."},{"i":"31","g":4,"q":"What three values must be added to the IPv4 properties of a NIC in order for a computer to have basic connectivity with the network? (Choose three.)","o":["subnet mask","DHCP server address","domain name","default gateway","speed and duplex","IP address"],"a":[0,3,5],"e":"","s":"The IP address, subnet mask, and default gateway address values should be added to the NIC properties in order for the computer to have basic network connectivity. This can be done either statically or dynamically with DHCP. An additional value that should be present if the computer is to be used to connect to the Internet is the DNS server value. A computer automatically attempts to locate a DHCP server if configured to do so. A DHCP server address is not used. Finally, NAT is configured on a router, not on a computer host, and speed and duplex settings are NIC hardware settings and not IPv4 properties of the NIC."},{"i":"32","g":4,"q":"A device has an IPv6 address of 2001:0DB8:75a3:0214:0607:1234:aa10:ba01 /64. What is the host identifier of the device?","o":["2001:0DB8:75a3","0607:1234:aa10:ba01","2001:0DB8","ba01"],"a":[1],"e":"","s":"An IPv6 address is made up of 128 bits that are represented as eight blocks of four hexadecimal digits that are called hextets. Because each hexadecimal digit represents four bits, each hextet represents 16 bits. The /64 network prefix indicates that the first 64 bits, or first four hextets, represent the network portion of the address. Because there are 128 bits in an IPv6 address, this leaves the last 64 bits, or last four hextets, to represent the host identifier. The value for the last four hextets is 0607:1234:aa10:ba01."},{"i":"33","g":12,"q":"How can a user prevent specific applications from accessing a Windows computer over a network?","o":["Enable MAC address filtering.","Disable automatic IP address assignment.","Block specific TCP or UDP ports in Windows Firewall.","Change default usernames and passwords."],"a":[2],"e":"","s":"Network applications have specific TCP or UDP ports that can be left open or blocked in Windows Firewall. Disabling automatic IP address assignment may result in the computer not being able to connect to the network at all. Enabling MAC address filtering is not possible in Windows and would only block specific network hosts, not applications. Changing default usernames and passwords will secure the computer from unauthorized users, not from applications."},{"i":"35","g":7,"q":"A technician has been asked to configure Wi-Fi calling on a corporate mobile device. In which situation would this feature be most advantageous?","o":["in an emergency situation and no minutes are left on the phone","when sending WEA updates","when in an area with poor cellular coverage","in a store transaction making a payment using the mobile device"],"a":[2],"e":"","s":"Wi-Fi calling is not supported on all mobile devices, but when enabled, it uses a Wi-Fi network to make voice calls. It is very useful in areas with poor cellular coverage."},{"i":"36","g":5,"q":"Which statement is true about laptops?","o":["Most of the internal components that are designed for laptops cannot be used for desktops.","Laptop motherboards have standard form factors.","Laptops use fewer components than desktops use.","Laptop CPUs do not use cooling devices."],"a":[0],"e":"","s":"Laptop internal components are designed with a small form factor and are proprietary. Although a laptop CPU uses less power, it needs a cooling device (heat sink and fan)."},{"i":"37","g":5,"q":"Which standard provides a bridge between laptop hardware and the operating system and a way for technicians to configure power management schemes to get the best performance?","o":["ACPI","PCIe","Bluetooth","802.11"],"a":[0],"e":"","s":"The Advanced Configuration and Power Interface (ACPI) standard has specific sleep states that can be assigned to a device in order to conserve power. PCIe is a motherboard interface. Bluetooth and 802.11 are wireless standards."},{"i":"38","g":5,"q":"Which two laptop components are considered replaceable by the customer. (Choose two.)","o":["battery","integrated card reader","mini-PCIe module","RAM","display"],"a":[0,3],"e":"","s":"Customer-replaceable units (CRUs) do not typically require a lot of technical skill to replace. RAM and a battery are two examples of a CRU. In contrast, a field-replaceable unit (FRU), such as a display, motherboard, keyboard, or touchpad, commonly requires a technician to install."},{"i":"39","g":5,"q":"A user wants to synchronize some apps, movies, music, and ebooks between mobile devices. What are the two types of connections used to synchronize this type of data? (Choose two.)","o":["cellular","Wi-Fi","USB","Bluetooth","NFC"],"a":[1,2],"e":"","s":"Because of the amount of data transferred during video synchronization, synchronization occurs through either a Wi-Fi connection or a wired USB connection."},{"i":"40","g":6,"q":"A technician is explaining the differences between inkjet printers and laser printers to a customer. Which two comparisons should the technician make? (Choose two.)","o":["Inkjet printers are less expensive as an initial purchase than laser printers.","A laser printer is significantly slower than an inkjet printer.","Both laser and inkjet printers produce poor quality images.","The laser printer output is dry after printing, but an inkjet printer may still have wet ink on the paper after printing.","Inkjet printers use plain paper to make economical prints, but laser printers require more expensive thermal paper."],"a":[0,3],"e":"","s":"Inkjet printers are easy to use and usually less expensive than laser printers. Some advantages of an inkjet printer are initial low cost, high resolution, and they are quick to warm up. Some disadvantages of an inkjet printer are that the nozzles are prone to clogging, ink cartridges can be expensive, and the ink is wet for a few seconds after printing. A laser printer is a high-quality, fast printer that uses a laser beam to create an image. Some advantages of a laser printer are low cost per page, high ppm, high capacity, and prints come out dry. Some disadvantages of a laser printer are high cost of startup, and that toner cartridges can be expensive."},{"i":"41","g":6,"q":"A user chooses the collate option and prints two copies of a three-page document. What is the order in which the pages are printed?","o":["pages 1, 1, 2, 2, 3, 3","pages 1, 2, 3, 1, 2, 3","pages 3, 3, 2, 2, 1, 1","pages 3, 2, 1, 3, 2, 1"],"a":[1],"e":"","s":"The collate feature enables a printer to sort multiple copies of a document with the proper page order for each copy."},{"i":"42","g":6,"q":"A color laser printer is used to print documents with graphics and photographs. Users are complaining that printing takes too long. Which component of the printer should be upgraded in order to improve printing performance?","o":["CPU","RAM","hard drive","toner cartridges"],"a":[1],"e":"","s":"Because documents with graphics and photographs generate much larger print jobs, the printing process will run more efficiently if the printer memory is adequate to store the entire job before the job starts."},{"i":"43","g":6,"q":"What service is available for Windows to provide software print server services to MAC OS clients?","o":["Bonjour Print Server","Print to XPS","Apple AirPort Extreme","Apple AirPrint"],"a":[0],"e":"","s":"Bonjour Printer Server from Apple comes with MAC OS X and is a free download for Windows users to be used as a software print server. Airport Extreme, a dedicated print server, and a PC with a printer attached serving as a print server are all hardware print sharing solutions."},{"i":"44","g":6,"q":"Which three components are typically found in laser printer maintenance kits? (Choose three.)","o":["fuser assembly","primary corona","pickup rollers","transfer rollers","secondary corona","paper trays"],"a":[0,2,3],"e":"","s":"Laser printer maintenance kits typically contain components that wear and can be installed with minimal disassembly of the printer. Corona wires are internal components that would require a trained technician to replace. Paper trays are components that are not typically replaced during maintenance, but would be replaced any time if damaged."},{"i":"45","g":6,"q":"A technician is installing a new printer in a cool, damp environment. After the printer cabling is done, and the software and print driver are installed, the printer test page jams. What is the most likely cause of the print failure?","o":["incorrect printer driver","too much humidity","not enough printer memory","loose printer cables"],"a":[1],"e":"","s":"Paper jams are commonly caused when the paper being used is dirty, affected by humidity, or is the wrong type of paper for the printer."},{"i":"46","g":7,"q":"A data center has recently updated a physical server to host multiple operating systems on a single CPU. The data center can now provide each customer with a separate web server without having to allocate an actual discrete server for each customer. What is the networking trend that is being implemented by the data center in this situation?","o":["BYOD","virtualization","maintaining communication integrity","online collaboration"],"a":[1],"e":"","s":"Virtualization technology can run several different operating systems in parallel on a single CPU."},{"i":"47","g":7,"q":"How does virtualization help with disaster recovery within a data center?","o":["Power is always provided.","Less energy is consumed.","Server provisioning is faster.","Hardware does not have to be identical."],"a":[3],"e":"","s":"Disaster recovery is how a company goes about accessing applications, data, and the hardware that might be affected during a disaster. Virtualization provides hardware independence which means the disaster recovery site does not have to have the exact equipment as the equipment in production. Server provisioning is relevant when a server is built for the first time. Although data centers do have backup generators, the entire data center is designed for disaster recovery. One particular data center could never guarantee that the data center itself would never be without power."},{"i":"48","g":7,"q":"Which two hypervisors are suitable to support virtual machines in a data center? (Choose two.)","o":["Virtual PC","VMware Fusion","VMware ESX/ESXi","Oracle VM VirtualBox","Microsoft Hyper-V 2012"],"a":[2,4],"e":"","s":"VMware ESX/ESXi and Microsoft Hyper-V 2012 are Type 1 hypervisors that have direct access to the hardware resources. Type 1 hypervisors are more efficient than hosted architectures, and enable greater scalability, performance, and robustness. They are used to support enterprise VMs in data centers. Oracle VM VirtualBox, VMware Fusion, and Microsoft Virtual PC are host based Type 2 hypervisors."},{"i":"49","g":7,"q":"A web designer accesses a company Windows 10 computer remotely. The designer often needs to simultaneously open multiple applications, such as a web page editor and a graphics editor. Rather than opening them in multiple windows, the designer opens them in different virtual desktops. What technology is being used by the designer?","o":["virtual reality","Windows Virtual Desktop","cloud-based applications","virtual desktop infrastructure"],"a":[1],"e":"","s":"Windows 10 has a feature called Windows Virtual Desktop (WVD). A user can create multiple virtual desktops and navigate among them easily. This feature reduces the clutter on a desktop of Windows caused by opening multiple applications. With WVD, a user can have each application open in a separate desktop."},{"i":"50","g":7,"q":"Which Cloud computing service would be best for an organization that needs to collaboratively create applications and deliver them over the web?","o":["PaaS","IaaS","SaaS","ITaaS"],"a":[0],"e":"","s":"Platform as a service (PaaS) provides a collaborative environment where multiple developers can create software and host an application through a Cloud provider."},{"i":"51","g":0,"q":"Which statement describes a feature of SDRAM?","o":["It requires constant power to function.","Its connector always has 240 pins.","It can process overlapping instructions in parallel.","It is able to support two writes and two reads per CPU clock cycle."],"a":[2],"e":"","s":"SDRAM ( Synchronous Dynamic RAM) works in synchronization with the memory bus and has higher transfer rates because it can process overlapping instructions in parallel."},{"i":"53","g":2,"q":"A technician is troubleshooting a server that displays the error message “RAID not found” after a power outage over the weekend. What is a possible cause for this?","o":["The BIOS firmware needs updating.","The FSB settings have changed and are wrong.","The external RAID controller is not receiving power.","The CPU multiplier is set too high."],"a":[2],"e":"","s":"The loss of the RAID controller can be caused by the external RAID controller not receiving power, incorrect BIOS settings, failure of the RAID controller or incorrect drivers for the RAID controller."},{"i":"54","g":5,"q":"A customer brings in a laptop with a touch screen that is not working correctly. The touch screen either does not respond at all or provides unusual or inaccurate responses. What is a possible cause for such behavior?","o":["The battery is not seated properly.","The DC jack is not grounded or is loose.","The digitizer is faulty.","Too many apps are open."],"a":[2],"e":"","s":"A touch screen that is unresponsive or inaccurate can be caused by dirt or grease on the screen, the screen protector, or apps consuming too many resources."},{"i":"55","g":6,"q":"What are two security risks associated with sharing printers in a corporate environment? (Choose two.)","o":["user authentication","cached files","document viewing in the print queue","dumpster diving","shoulder surfing"],"a":[1,2],"e":"","s":"Three security concerns related to shared printers include (1) cached print files could contain sensitive data; (2) user authentication is needed to control access to the printer; and (3) print jobs could be read by others, intercepted, copied, or modified. Although the names of documents can be viewed in the print queue, document viewing is not possible. Dumpster diving and shoulder surfing are security concerns whether the printer is shared or not."},{"i":"56","g":2,"q":"Which change management process component is concerned with the business processes that are affected by changes?","o":["assessment","approval","implementation","identification"],"a":[0],"e":"","s":"There are several change management process components that help changes, installations, and upgrades go more easily. The assessment component identifies the business processes that are affected and the costs and resources required."},{"i":"58","g":1,"q":"A computer technician is installing a RAID. If the RAID uses mirroring and striping, which RAID level is the technician using?","o":["10","5","1","8"],"a":[0],"e":"","s":"RAID Levels: RAID Level\tMinimum Number of Drives\tFeatures 0\t2\tStriping 1\t2\tMirroring 5\t3\tStriping with parity 6\t3\tStriping with double parity 10 (0+1)\t4\tMirroring and Striping"},{"i":"59","g":1,"q":"A computer technician is installing a RAID. If the RAID uses mirroring, which RAID level is the technician using?","o":["1","6","5","3"],"a":[0],"e":"","s":"RAID Levels: RAID Level\tMinimum Number of Drives\tFeatures 0\t2\tStriping 1\t2\tMirroring 5\t3\tStriping with parity 6\t3\tStriping with double parity 10 (0+1)\t4\tMirroring and Striping"},{"i":"60","g":1,"q":"A computer technician is installing a RAID. If the RAID uses striping with parity, which RAID level is the technician using?","o":["5","6","1","4"],"a":[0],"e":"","s":"RAID Levels: RAID Level\tMinimum Number of Drives\tFeatures 0\t2\tStriping 1\t2\tMirroring 5\t3\tStriping with parity 6\t3\tStriping with double parity 10 (0+1)\t4\tMirroring and Striping"},{"i":"61","g":1,"q":"A computer technician is installing a RAID. If the RAID uses striping, which RAID level is the technician using?","o":["0","6","5","2"],"a":[0],"e":"","s":"RAID Levels: RAID Level\tMinimum Number of Drives\tFeatures 0\t2\tStriping 1\t2\tMirroring 5\t3\tStriping with parity 6\t3\tStriping with double parity 10 (0+1)\t4\tMirroring and Striping"},{"i":"62","g":1,"q":"A computer technician is installing a RAID. If the RAID uses striping with double parity, which RAID level is the technician using?","o":["6","1","5","7"],"a":[0],"e":"","s":"RAID Levels: RAID Level\tMinimum Number of Drives\tFeatures 0\t2\tStriping 1\t2\tMirroring 5\t3\tStriping with parity 6\t3\tStriping with double parity 10 (0+1)\t4\tMirroring and Striping"},{"i":"63","g":1,"q":"A technician is upgrading many PCs used within the company. How should the technician dispose of an old battery?","o":["Throw it away.","Take it to the garbage dump.","Burn it.","Recycle following local regulations."],"a":[3],"e":"Электроника содержит токсичные материалы (свинец, ртуть, кадмий), поэтому её нельзя выбрасывать или сжигать — только переработка по местным правилам.","s":""},{"i":"64","g":1,"q":"A technician is upgrading many PCs used within the company. How should the technician dispose of a broken monitor?","o":["Bury it.","Recycle following local regulations.","Take it to the garbage dump.","Burn it."],"a":[1],"e":"Электроника содержит токсичные материалы (свинец, ртуть, кадмий), поэтому её нельзя выбрасывать или сжигать — только переработка по местным правилам.","s":""},{"i":"65","g":1,"q":"A technician is upgrading many PCs used within the company. How should the technician dispose of an old power supply?","o":["Burn it.","Take it to the garbage dump.","Recycle following local regulations.","Bury it."],"a":[2],"e":"Электроника содержит токсичные материалы (свинец, ртуть, кадмий), поэтому её нельзя выбрасывать или сжигать — только переработка по местным правилам.","s":""},{"i":"66","g":1,"q":"A technician is upgrading many PCs used within the company. How should the technician dispose of old RAM?","o":["Destroy it with a hammer.","Burn it.","Bury it.","Recycle following local regulations."],"a":[3],"e":"Электроника содержит токсичные материалы (свинец, ртуть, кадмий), поэтому её нельзя выбрасывать или сжигать — только переработка по местным правилам.","s":""},{"i":"67","g":1,"q":"A technician is upgrading many PCs used within the company. How should the technician dispose of an old motherboard?","o":["Seal in a plastic bag before putting in the garbage.","Recycle following local regulations.","Give it to your neighbor.","Destroy it with a hammer."],"a":[1],"e":"Электроника содержит токсичные материалы (свинец, ртуть, кадмий), поэтому её нельзя выбрасывать или сжигать — только переработка по местным правилам.","s":""},{"i":"68","g":1,"q":"A technician is upgrading many PCs used within the company. How should the technician dispose of an old hard drive?","o":["Seal in a cardboard box.","Give it to your neighbor.","Destroy it with a hammer.","Recycle following local regulations."],"a":[3],"e":"Электроника содержит токсичные материалы (свинец, ртуть, кадмий), поэтому её нельзя выбрасывать или сжигать — только переработка по местным правилам.","s":""},{"i":"69","g":2,"q":"After continuous morning use, a computer suddenly reboots without the intervention of the user. What are the two most likely hardware parts that could cause this problem? (Choose two.)","o":["CPU","hard drive","RAID","power supply","BIOS","wireless NIC"],"a":[0,3],"e":"Самопроизвольные перезагрузки чаще всего вызывают неисправный блок питания (нестабильное напряжение) или процессор (перегрев, сбой).","s":""},{"i":"70","g":2,"q":"A technician has been called in to investigate a problem with the computer rebooting randomly throughout the day. What two pieces of hardware could cause this problem? (Choose two.)","o":["power supply","surge strip","ROM","wireless NIC","motherboard","CPU"],"a":[0,5],"e":"Самопроизвольные перезагрузки чаще всего вызывают неисправный блок питания (нестабильное напряжение) или процессор (перегрев, сбой).","s":""},{"i":"71","g":2,"q":"For two days in a row, a user has noticed that the computer reboots several times before it eventually starts. What are two suspect components? (Choose two.)","o":["CPU","power supply","BIOS","ROM","wireless NIC","motherboard"],"a":[0,1],"e":"Самопроизвольные перезагрузки чаще всего вызывают неисправный блок питания (нестабильное напряжение) или процессор (перегрев, сбой).","s":""},{"i":"72","g":2,"q":"While a user is working on a spreadsheet, the computer reboots. What are two components that could cause this issue? (Choose two.)","o":["power supply","ROM","BIOS","RAID","CPU","wireless NIC"],"a":[0,4],"e":"Самопроизвольные перезагрузки чаще всего вызывают неисправный блок питания (нестабильное напряжение) или процессор (перегрев, сбой).","s":""},{"i":"73","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 137. What service application is the client requesting?","o":["NetBIOS (NetBT)","SMB/CIFS","HTTPS","SLP"],"a":[0],"e":"Порт 137 — NetBIOS (NetBT).","s":""},{"i":"74","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 22. What service application is the client requesting?","o":["SMB/CIFS","HTTPS","SLP","SSH"],"a":[3],"e":"Порт 22 — SSH — защищённый удалённый доступ.","s":""},{"i":"75","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 143. What service application is the client requesting?","o":["IMAP","SMB/CIFS","HTTPS","SLP"],"a":[0],"e":"Порт 143 — IMAP — приём почты.","s":""},{"i":"76","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 23. What service application is the client requesting?","o":["SMB/CIFS","Telnet","HTTPS","SLP"],"a":[1],"e":"Порт 23 — Telnet — удалённый доступ без шифрования.","s":""},{"i":"77","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 161. What service application is the client requesting?","o":["SNMP","SMB/CIFS","HTTPS","SLP"],"a":[0],"e":"Порт 161 — SNMP — мониторинг сетевых устройств.","s":""},{"i":"78","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 389. What service application is the client requesting?","o":["SMB/CIFS","HTTPS","SLP","LDAP"],"a":[3],"e":"Порт 389 — LDAP — службы каталогов.","s":""},{"i":"79","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 25. What service application is the client requesting?","o":["SMB/CIFS","HTTPS","SMTP","SLP"],"a":[2],"e":"Порт 25 — SMTP — отправка почты.","s":""},{"i":"80","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 427. What service application is the client requesting?","o":["SLP","SMB/CIFS","SMTP","DNS"],"a":[0],"e":"Порт 427 — SLP — поиск служб.","s":""},{"i":"81","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 53. What service application is the client requesting?","o":["SMTP","DHCP","TFTP","DNS"],"a":[3],"e":"Порт 53 — DNS — преобразование имён в IP.","s":""},{"i":"82","g":4,"q":"Which is the compressed format of the IPv6 address 2001:0db8:0000:0000:0000:a0b0:0008:0001?","o":["2001:db80:0:1::80:1","2001:db8::a0b0:8:1","2001:db8::ab8:1:0:1000","2001:db80:::1::80:1"],"a":[1],"e":"Сжатие IPv6: убрать ведущие нули в каждом хекстете и заменить одну (самую длинную) цепочку нулевых хекстетов на «::» — только один раз.","s":""},{"i":"83","g":4,"q":"Which is the compressed format of the IPv6 address fe80:09ea:0000:2200:0000:0000:0fe0:0290?","o":["fe80:9ea:0:2200::fe0:290","fe80:9:20::b000:290","fe80:9ea0::2020:0:bf:e0:9290","fe80:9ea0::2020::bf:e0:9290"],"a":[0],"e":"Сжатие IPv6: убрать ведущие нули в каждом хекстете и заменить одну (самую длинную) цепочку нулевых хекстетов на «::» — только один раз.","s":""},{"i":"84","g":4,"q":"Which is the compressed format of the IPv6 address 2002:0042:0010:c400:0000:0000:0000:0909?","o":["200:420:110:c4b::910:0:90","2002:4200::25:1090:0:99","2002:42::25:1090:0:99","2002:42:10:c400::909"],"a":[3],"e":"Сжатие IPv6: убрать ведущие нули в каждом хекстете и заменить одну (самую длинную) цепочку нулевых хекстетов на «::» — только один раз.","s":""},{"i":"85","g":4,"q":"Which is the compressed format of the IPv6 address 2002:0420:00c4:1008:0025:0190:0000 ate describes when the CPU is off, but the RAM is refreshed?","o":["S1","S2","S3","S4"],"a":[1],"e":"S2 — CPU выключен, RAM обновляется (более глубокий сон, чем S1).","s":""},{"i":"92","g":5,"q":"What ACPI power state describes when the computer is off?","o":["S1","S2","S3","S5"],"a":[3],"e":"S5 — компьютер выключен.","s":""},{"i":"93","g":5,"q":"What ACPI power state describes when the CPU is off and the RAM is set to a slow refresh rate, often called suspend mode?","o":["S4","S2","S3","S5"],"a":[2],"e":"S3 — режим ожидания (suspend): CPU выключен, RAM в режиме медленного обновления.","s":""},{"i":"94","g":5,"q":"What ACPI power state describes when the computer is on and the CPU is running?","o":["S0","S4","S3","S5"],"a":[0],"e":"S0 — ПК включён, CPU работает.","s":""},{"i":"95","g":6,"q":"A reporter is trying to print several high resolution photographs but the color laser printer is going extremely slowly. What should the technician do to resolve the issue?","o":["Rewind the ribbon.","Connect the printer using wireless.","Install a USB hub.","Add more RAM to the printer.","Update the BIOS."],"a":[3],"e":"Фото высокого разрешения создают большие задания печати — ускорить печать поможет увеличение памяти (RAM) принтера.","s":""},{"i":"96","g":6,"q":"A new printer has just been installed deep in a mine. When test pages are printed, the paper constantly jams. What should the technician do to resolve the issue?","o":["Move the printer to a less-humid location.","Clean the printer.","Connect the printer using wireless.","Install a USB hub.","Update the BIOS."],"a":[0],"e":"Влажность вызывает замятие бумаги — перенесите принтер в сухое место.","s":""},{"i":"97","g":6,"q":"A user complains that recently every printed document has vertical lines and streaks on the paper. What should the technician do to resolve the issue?","o":["Distribute the toner more evenly within the cartridge.","Clean the printer.","Connect the printer using wireless.","Install a USB hub.","Update
