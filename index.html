le causes of this issue? (Choose two.)","o":["The paper may be wrinkled.","The paper tray is flimsy.","The printer could be set to print to a different paper size than is currently loaded.","The printer has been installed on the wrong port.","The printer service is stopped or not working properly."],"a":[0,2],"e":"Бумага не подаётся: она мятая или выбран размер, не совпадающий с загруженным.","s":""},{"i":"111","g":11,"q":"A laptop has an NVMe drive (C:) and a mechanical hard drive (D:). When the user tries to save a spreadsheet to the D: drive, the user notices that the D: drive is not there. What should the technician do to see if the drive is recognized by the operating system?","o":["Use the Msconfig utility.","Boot into UEFI/BIOS and see if the drive appears.","Remove the drive and attach it to the SATA port used by the SSD. Reboot the computer and see if the drive is recognized.","Use the Disk Management Control Panel."],"a":[3],"e":"Диски проверяют в «Управлении дисками» (Disk Management) — там видно, распознан ли накопитель.","s":""},{"i":"112","g":11,"q":"A computer has two mechanical hard drives. The second drive (D:) is used for data storage. When trying to save an email attachment to the local hard drive, the user notices that the D: drive is not an option. What should the technician do to see if the drive is recognized by the operating system?","o":["Use File Explorer.","Swap the data cables of the mechanical drive and the SSD.","Open a web browser and type the following: http://127.0.0.1. Verify if both drives appear in the list.","Bring up a command prompt and type ipconfig."],"a":[0],"e":"Проводник (File Explorer) покажет, распознан ли диск системой.","s":""},{"i":"113","g":2,"q":"A user reports that a drive is no longer there. The technician asks the user to demonstrate the problem. Within the application, the user demonstrates that the drive, that was present in the save options yesterday, is now no longer an option. What should the technician do to see if the drive is recognized by the operating system?","o":["Use Device Manager.","Check the Startup folder.","Bring up a command prompt and type ipconfig.","Swap the data cables of the mechanical drive and the SSD."],"a":[0],"e":"Диспетчер устройств показывает, распознан ли накопитель.","s":""},{"i":"114","g":11,"q":"A computer has an SSD for the operating system and applications and uses another mechanical hard drive for data storage. The user reports that data can no longer be saved to the mechanical hard drive. What should the technician do to see if the drive is recognized by the operating system?","o":["Swap the data cables of the mechanical drive and the SSD.","Use File Explorer.","Open a web browser and type the following: http://127.0.0.1. Verify if both drives appear in the list.","Bring up a command prompt and type ipconfig."],"a":[1],"e":"Проводник покажет, видит ли ОС диск.","s":""},{"i":"115","g":7,"q":"A technician is working on a laptop and the GPS is not functioning. What is a probable cause for this situation?","o":["The GPU is overheating.","A service is disabled.","The screen resolution needs recalibration.","The screen refresh rate is too low."],"a":[1],"e":"GPS работает как служба — если она отключена, GPS не функционирует.","s":""},{"i":"116","g":7,"q":"A technician is working on a laptop and an app is not loading. What is a probable cause for this situation?","o":["An app needs to be restarted.","More than one app is open simultaneously.","The screen resolution needs recalibration.","The screen refresh rate is too low."],"a":[1],"e":"Одновременно открытые приложения занимают ресурсы, и нужное может не загрузиться.","s":""},{"i":"117","g":2,"q":"A technician is working on a laptop and an app is not responding. What is a probable cause for this situation?","o":["The battery is low.","The GPU is overheating.","An app needs to be restarted.","Wi-Fi is turned off."],"a":[2],"e":"Зависшее приложение обычно достаточно перезапустить.","s":""},{"i":"118","g":7,"q":"A technician is working on a laptop and an error message about decryption appears when opening an email. What is a probable cause for this situation?","o":["The display setting is incorrect.","The GPU is overheating.","Wi-Fi is turned off.","A digital certificate is missing."],"a":[3],"e":"Для расшифровки писем нужен цифровой сертификат — без него появляется ошибка.","s":""},{"i":"119","g":4,"q":"A PC technician has been asked by a supervisor to recommend a security solution for a small company that wants stateful firewall services. Which security technique should the technician recommend?","o":["Buy an ASA.","Disable ports.","Use a VPN.","Setup footprinting."],"a":[0],"e":"Stateful-файрвол (с отслеживанием состояния) — функция устройства Cisco ASA.","s":""},{"i":"120","g":9,"q":"A gamer is booting a desktop that has Windows 10 installed on dynamic drives. The boot process is currently working on the following step: WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers. What is the next step that will happen in the boot process?","o":["The Windows kernel takes over the boot process.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.","Winload uses the path specified in BOOTMGR to find the boot partition."],"a":[2],"e":"Правильный следующий шаг: «WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"Boot Sequence for Windows: - Power on Self Test (POST) - POST for each adapter card that has a BIOS - BIOS reads the MBR - MBR takes over control of the boot process and starts BOOTMGR - BOOTMGR reads the Boot Configuration Data file to know which OS to load and where to find the OS on the boot partition - BOOTMGR invokes WINLOAD.EXE in order to load the NTOSKRNL.EXE file and HAL.DLL - BOOTMGR reads the registry files and loads device drivers - NTOSKRNL.EXE starts the WINLOGON.EXE program and displays the Windows login screen At this point, the NT kernel takes over. The NT kernel is the heart of all Windows operating systems. The name of this file is NTOSKRNL.EXE. It starts the login file called WINLOGON.EXE and displays the Windows Welcome screen."},{"i":"121","g":7,"q":"A technician is working on a laptop and an error message about decryption appears when opening an email. What is a possible solution for this situation?","o":["Install an appropriate certificate.","Check the screen refresh rate.","Ensure that only one app is open at a time.","Ensure that Wi-Fi is turned off."],"a":[0],"e":"Решение — установить подходящий цифровой сертификат.","s":""},{"i":"122","g":6,"q":"Users in the sales department want to be able to print from laptops and tablets. Which two wireless technologies should the IT technician look for when researching new printers for the sales department? (Choose two.)","o":["cellular","Bluetooth","ZigBee","NFC","802.11 standard"],"a":[1,4],"e":"","s":"Many printers come with built-in wireless capability which enables them to be connected to a WiFi network (802.11 standard). Some come equipped with the ability to connect to devices through Bluetooth pairing."},{"i":"123","g":0,"q":"What are three factors to consider when purchasing a replacement motherboard? (Choose three.)","o":["The existing power supply must provide the connections required by the new motherboard.","The new motherboard must be the correct size to physically fit into the existing case.","The replacement motherboard must have the same manufacturer as the existing case.","The new motherboard must come from the same manufacturer as the existing motherboard.","The socket and chipset on the new motherboard must match the existing CPU.","The new motherboard must support the same UEFI BIOS as the previous motherboard."],"a":[0,1,4],"e":"","s":"Because you have to match the motherboard with the parts like power supply form factor, case form factor, cpu socket/chipset, RAM that will remain the same. You replace only the motherboard in this case."},{"i":"124","g":3,"q":"What are two features of protocols used within the TCP/IP protocol stack? (Choose two.)","o":["TCP mechanisms retransmit data when an acknowledgment is not received from the destination system within a set period of time.","UDP is used when an application must be delivered as quickly as possible and some loss of data can be tolerated.","The Internet Layer IP protocol has built in mechanisms for ensuring the reliable transmission and receipt of data.","The same Transport Layer source port is used for all of the tabs opened at the same time within a web browser.","TCP and UDP destination port numbers are dynamically generated by the sending device in order to track the responses to requests."],"a":[0,1],"e":"","s":"Application programmers make decisions about which protocols to use to transport the data to and from their applications based on whether the application can tolerate any lost data. Live streaming and voice transmissions can use UDP because if a few data packets are lost, the quality of the video and audio is not seriously impacted. TCP is used when all data must be complete and accurate."},{"i":"125","g":2,"q":"A technician is working on a laptop and a key on the keyboard is not responding as it should. What is a possible solution for this situation?","o":["Clean with compressed air.","Ensure that Bluetooth is not activated.","Check the screen refresh rate.","Check the display settings."],"a":[0],"e":"Западающую клавишу чистят сжатым воздухом.","s":""},{"i":"126","g":6,"q":"What two effects might suggest that an incorrect printer driver is loaded on the Windows PC? (Choose two.)","o":["The printer is printing unknown characters.","Print jobs appear in the print queue, but are not printed.","Toner is smearing or rubbing off the page.","The printer does not print a test page.","Paper jams are occurring frequently."],"a":[0,3],"e":"Неверный драйвер даёт «кракозябры» и не даёт напечатать тестовую страницу.","s":""},{"i":"127","g":4,"q":"Why would a network technician change the wireless router IP address to a different private IP address during initial installation?","o":["to enable the router to become the DHCP server for the network and to perform NAT","to limit the number of devices and users that can attach to the wireless network","to ensure that users will have to manually configure the network name in their wireless clients","to decrease the likelihood that someone could access the router using the default settings","to strengthen the network mode login security and encryption settings"],"a":[3],"e":"Смена заводского IP роутера снижает риск доступа к нему по настройкам по умолчанию.","s":""},{"i":"128a","g":5,"q":"A technician is working on a laptop and GPS is not functioning. What is a possible solution for this situation?","o":["Verify that airplane mode is not activated.","Ensure that Wi-Fi is turned off.","Check the screen refresh rate.","Check the display settings."],"a":[0],"e":"Режим «В самолёте» отключает GPS — проверьте, что он выключен.","s":""},{"i":"128b","g":5,"q":"A technician is working on a laptop and GPS is not functioning. What is a possible solution for this situation?","o":["Verify the status of service.","Ensure that only one app is open at a time.","Recharge the battery.","Check the display settings."],"a":[0],"e":"GPS — это служба; проверьте, что она работает.","s":""},{"i":"129","g":1,"q":"Which factor can limit the amount of data that the CPU can receive and process at one time?","o":["whether CPU virtualization is enabled","the width of the front side bus (FSB)","the size of the CPU cache memory","the amount of RAM memory installed"],"a":[1],"e":"Ширина шины FSB определяет, сколько данных CPU получает и обрабатывает за раз.","s":""},{"i":"130","g":0,"q":"Which type of optical drive supports the greatest amount of storage and is able to read and write CDs, DVDs, and Blu-Ray media?","o":["BD-ROM","BD-RE","CD-RW","DVD-RW","DVD-ROM"],"a":[1],"e":"BD-RE — самый ёмкий: читает и пишет CD, DVD и Blu-ray.","s":""},{"i":"131","g":9,"q":"A manager is booting a tablet that has Windows 10 installed. The boot process is currently working on the following step: WINLOGON.EXE displays the Windows Welcome screen What is the next step that will happen in the boot process?","o":["Winload uses the path specified in BOOTMGR to find the boot partition.","The BIOS boots the computer using the first drive that contains a valid boot sector.","The code in the boot sector is executed and the control of the boot process is given to Windows Boot Manager.","There are no more steps, the boot process is complete."],"a":[3],"e":"Правильный следующий шаг: «There are no more steps, the boot process is complete.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"Boot Sequence for Windows: - Power on Self Test (POST) - POST for each adapter card that has a BIOS - BIOS reads the MBR - MBR takes over control of the boot process and starts BOOTMGR - BOOTMGR reads the Boot Configuration Data file to know which OS to load and where to find the OS on the boot partition - BOOTMGR invokes WINLOAD.EXE in order to load the NTOSKRNL.EXE file and HAL.DLL - BOOTMGR reads the registry files and loads device drivers - NTOSKRNL.EXE starts the WINLOGON.EXE program and displays the Windows login screen At this point, the NT kernel takes over. The NT kernel is the heart of all Windows operating systems. The name of this file is NTOSKRNL.EXE. It starts the login file called WINLOGON.EXE and displays the Windows Welcome screen."},{"i":"132","g":10,"q":"Why would a manager need to use the sfc command?","o":["to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to move that file to a different Windows directory while also leaving the file in the current location","to copy a group of files from one Windows directory to another","to relocate a file from one Windows directory to another one"],"a":[0],"e":"sfc /scannow проверяет целостность защищённых системных файлов и заменяет повреждённые.","s":""},{"i":"133","g":10,"q":"Why would a technician need to use the DISM command?","o":["to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system","to move that file to a different Windows directory while also leaving the file in the current location","to copy a group of files from one Windows directory to another","to relocate a file from one Windows directory to another one"],"a":[0],"e":"DISM восстанавливает и подготавливает образы Windows и образ восстановления.","s":""},{"i":"134","g":10,"q":"Why would a technician need to use the tasklist command?","o":["to display a list of current processes running on a local or a remote computer","to create a new Windows directory","to remove an empty directory","to change from the current working folder to another folder"],"a":[0],"e":"tasklist показывает список запущенных процессов (локально или удалённо).","s":""},{"i":"135","g":10,"q":"Why would an analyst need to use the taskkill command?","o":["to end one or more processes on a PC based on process ID or image name","to create a new Windows directory","to remove an empty directory","to change from the current working folder to another folder"],"a":[0],"e":"taskkill завершает процессы по ID или имени образа.","s":""},{"i":"136","g":10,"q":"Why would an analyst need to use the msconfig command?","o":["to select some programs that will automatically run at startup","to remove an empty directory","to erase one or more files from a Windows directory","to create a new Windows directory"],"a":[0],"e":"msconfig настраивает, какие программы и службы запускаются при старте системы.","s":""},{"i":"137","g":10,"q":"Why would an analyst need to use the dir command?","o":["to show all of the files in the current directory","to remove an empty directory","to erase one or more files from a Windows directory","to create a new Windows directory"],"a":[0],"e":"dir выводит список файлов и папок текущего каталога.","s":""},{"i":"138","g":10,"q":"Why would a bank manager need to use the gpupdate command?","o":["to make the PC synchronize with new group policy settings","to remove an empty directory","to erase one or more files from a Windows directory","to create a new Windows directory"],"a":[0],"e":"gpupdate принудительно применяет новые параметры групповой политики.","s":""},{"i":"139","g":10,"q":"Why would a bank manager need to use the gpresult command?","o":["to verify the settings that are suspected to be incorrect","to remove an empty directory","to erase one or more files from a Windows directory","to create a new Windows directory"],"a":[0],"e":"gpresult показывает результирующие параметры групповой политики — для проверки подозрительных настроек.","s":""},{"i":"140","g":10,"q":"Why would a lawyer need to use the cd command?","o":["to change from the current working folder to another folder","to remove an empty directory","to erase one or more files from a Windows directory","to create a new Windows directory"],"a":[0],"e":"cd меняет текущую папку.","s":""},{"i":"141","g":0,"q":"Which two activities are normally controlled by the Northbridge part of the chipset? (Choose two.)","o":["communication between the CPU and the I/O ports","access to the RAM","communication between the CPU and the hard drive","access to the video card","communication between the CPU and the sound card"],"a":[1,3],"e":"","s":"The Northbridge chipset generally controls access to the RAM, video card, and the speeds at which the CPU can communicate with them."},{"i":"142","g":9,"q":"A manager is booting a tablet that has Windows 8 installed. The boot process is currently working on the following step: WINLOGON.EXE displays the Windows Welcome screen What is the next step that will happen in the boot process?","o":["There are no more steps, the boot process is complete.","The BIOS boots the computer using the first drive that contains a valid boot sector.","The code in the boot sector is executed and the control of the boot process is given to Windows Boot Manager.","Winload uses the path specified in BOOTMGR to find the boot partition."],"a":[0],"e":"Правильный следующий шаг: «There are no more steps, the boot process is complete.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"Boot Sequence for Windows: - Power on Self Test (POST) - POST for each adapter card that has a BIOS - BIOS reads the MBR - MBR takes over control of the boot process and starts BOOTMGR - BOOTMGR reads the Boot Configuration Data file to know which OS to load and where to find the OS on the boot partition - BOOTMGR invokes WINLOAD.EXE in order to load the NTOSKRNL.EXE file and HAL.DLL - BOOTMGR reads the registry files and loads device drivers - NTOSKRNL.EXE starts the WINLOGON.EXE program and displays the Windows login screen At this point, the NT kernel takes over. The NT kernel is the heart of all Windows operating systems. The name of this file is NTOSKRNL.EXE. It starts the login file called WINLOGON.EXE and displays the Windows Welcome screen."},{"i":"143","g":9,"q":"An analyst is booting a tablet that has Windows 7 installed with media card reader. The boot process is currently working on the following step: WINLOGON.EXE displays the Windows Welcome screen What is the next step that will happen in the boot process?","o":["There are no more steps, the boot process is complete.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","The Windows kernel takes over the boot process."],"a":[0],"e":"Правильный следующий шаг: «There are no more steps, the boot process is complete.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":""},{"i":"145","g":11,"q":"Before installing the latest version of printer management software, an IT technician creates a restore point on the Windows 10 computer. The installation fails before it is complete, and now the printer shows as unavailable. Which Windows option should the technician use to reverse the software installation and return the system to its prior state without affecting users files and settings?","o":["Backup and Restore","System Restore","File History","Registry editor"],"a":[1],"e":"System Restore откатывает ПО к точке восстановления, не затрагивая личные файлы.","s":""},{"i":"146","g":8,"q":"A new customer asks if all of its older company computers, which are still running Windows XP, can be immediately upgraded to Windows 10. What are two important concerns that the IT technician must discuss with the customer in order to determine if the OS upgrade can be done? (Choose two.)","o":["the availability of wireless 802.11 standards support in the new OS","OS support for new printers and scanners they may purchase","compatibility of existing applications and custom software with the new OS","the timeframe for the end of support for Windows 10","minimum memory and processor requirements for Windows 10"],"a":[2,4],"e":"Перед переходом с XP на Windows 10 проверяют совместимость программ и минимальные требования к памяти и CPU.","s":""},{"i":"147","g":12,"q":"Which three wireless router settings should be disabled as a security best practice? (Choose three.)","o":["UPnP support","WPS auto configuration","SSID broadcast","MAC address filtering","parental controls","802.11i authentication"],"a":[0,1,2],"e":"UPnP, WPS и вещание SSID повышают риск взлома — их лучше отключить.","s":""},{"i":"149","g":12,"q":"What are two symptoms that indicate that a computer system may be a victim of DNS spoofing? (Choose two.)","o":["The output of the nslookup command reports an unknown resolver name and IP address.","Entering www.cisco.com in a browser displays a popular gaming site instead of the Cisco homepage.","System files have been renamed and some user files are missing from the computer hard drive.","The user receives Access Denied errors when attempting to download files from the network servers.","A user is receiving thousands of junk emails each day and contacts report receiving spam from the user."],"a":[0,1],"e":"DNS spoofing: вместо нужного сайта открывается другой, а nslookup показывает неизвестный DNS-сервер.","s":""},{"i":"150","g":12,"q":"A PC technician has been asked by a supervisor to recommend a security solution for preventing tailgating. Which security technique should the technician recommend?","o":["Employ ping sweeps.","Use a mantrap.","Buy an ASA.","Buy an IPS."],"a":[1],"e":"Mantrap (шлюз-тамбур) не пускает «паровозом» (tailgating).","s":""},{"i":"152","g":7,"q":"A company contracts with a service provider to obtain IaaS and ITaaS services. What are two advantages of these types of cloud service implementation? (Choose two.)","o":["increased control over the types of equipment purchased","less internet bandwidth required for the LAN","fewer switch ports needed to connect LAN users","less investment in local equipment and training","protection from costly upgrades and software licenses"],"a":[3,4],"e":"","s":"Cloud service providers have extended the IaaS model to also provide IT as a service (ITaaS). ITaaS can extend the capability of IT without requiring investment in new infrastructure, training new personnel, or licensing new software. These services are available on demand and delivered economically to any device anywhere in the world without compromising security or function."},{"i":"153","g":5,"q":"What are two methods of disabling cellular data when located in an area where it is limited or expensive? (Choose two.)","o":["turning on a personal hotspot","enabling Bluetooth for data connections","using a secure VPN connection","placing the device in Airplane mode","using Settings to turn off mobile data"],"a":[3,4],"e":"","s":"Mobile data can be turned off using the Settings options on both Android and Apple phones. Airplane mode turns off all cellular, WiFi, and Bluetooth capabilities. Once airplane mode has been turned on, Wi-Fi, Bluetooth, and other wireless functionality can be turned back on except for cellular."},{"i":"155","g":1,"q":"A help desk technician receives a call from a user describing an issue with a computer. The user states that the computer will not power on, that it only makes a beeping sound. Why does the technician ask the user to restart the system and count how many beeps the computer makes?","o":["Different numbers of beeps can indicate different types of hardware issues discovered during POST.","Fewer than 4 beeps usually indicate a problem with software loaded on the computer.","The number of beeps indicates the severity of the hardware issue--more beeps mean a more severe problem.","The number of beeps relates to beep codes that are standardized across all manufacturers."],"a":[0],"e":"Число сигналов (beep codes) при POST указывает на тип аппаратной неисправности (у разных производителей коды разные).","s":""},{"i":"156","g":7,"q":"A college uses Microsoft 365 Office and email services for its faculty, staff, and students. Data storage, custom applications, and Microsoft Active Directory services are delivered by virtual servers leased from a local data center. Single sign-on is implemented for both environments for authentication and authorization. Access control is managed locally. What type of cloud service implementation is the college using?","o":["hybrid cloud","community cloud","public cloud","private cloud"],"a":[0],"e":"Гибридное облако — часть сервисов в публичном облаке, часть в частной инфраструктуре.","s":""},{"i":"157","g":2,"q":"The help desk receives a call from a customer who reports a computer issue that occurs after trying to install Windows 10 with a disc that the IT department provided. When the customer reboots the computer, instead of loading Windows, the computer displays the Windows installation program screen again. Which probable cause should the IT technician place at the top of the list of most obvious reasons for the error?","o":["The Windows 10 installation did not complete correctly.","The boot order in the BIOS is incorrect.","The hard drive in the computer is beginning to fail.","The customer forgot to remove the disc from the optical drive."],"a":[3],"e":"Самая очевидная причина — забытый диск в приводе: ПК снова запускает установщик.","s":""},{"i":"158","g":4,"q":"Office workers in a software company are being temporarily relocated to a different area of the building while their previous office space is being reconfigured. Which type of network device should be installed to make it easy for the users to connect to the company network from all of their devices, including smart phones, tablets, and laptops?","o":["hub or repeater","network switch","access point","modem"],"a":[2],"e":"Точка доступа (AP) позволяет подключить все беспроводные устройства.","s":""},{"i":"159","g":1,"q":"What is an example of an active cooling solution for a desktop PC?","o":["reducing the speed at which the CPU operates","applying thermal paste on top of the CPU","adding a heat sink on top of the CPU","installing case and CPU cooling fans"],"a":[3],"e":"Активное охлаждение — это вентиляторы; радиатор и термопаста — пассивные решения.","s":""},{"i":"160","g":0,"q":"What is a consequence of a computer not having enough RAM memory installed?","o":["Data may be swapped between the RAM and the slower hard drive more frequently.","Data and program code may be swapped between RAM and faster EEPROMs.","USB flash memory can be used instead of RAM to improve performance.","Programs and files can be held temporarily on ROM chips on the motherboard."],"a":[0],"e":"При нехватке RAM система чаще подкачивает данные на медленный диск (swap).","s":""},{"i":"162","g":0,"q":"Which type of power supply is the most commonly used and provides a separate power connection in order to directly power the CPU?","o":["ATX","AT","EPS12V","ATX12V"],"a":[3],"e":"ATX12V — самый распространённый блок питания с отдельным разъёмом питания процессора.","s":""},{"i":"164","g":1,"q":"Which function is incorporated into some Intel CPUs that enables a single CPU to perform as though two CPUs are installed?","o":["overclocking","HyperTransport","Hyper-Threading","64-bit FSB"],"a":[2],"e":"","s":"Various CPU manufacturers complement their CPU with performance-enhancing features. For instance, Intel incorporates Hyper-Threading to enhance the performance of some of their CPUs. With Hyper-Threading, multiple pieces of code (threads) are executed simultaneously in the CPU. To an operating system, a single CPU with Hyper-Threading performs as though there are two CPUs when multiple threads are being processed. AMD processors use HyperTransport to enhance CPU performance. HyperTransport is a high-speed connection between the CPU and the Northbridge chip."},{"i":"165","g":2,"q":"Which cloud computing characteristic enables multiple tenants to share the same storage, processing, and network bandwidth?","o":["on-demand provisioning","client-side emulation","broad network access","resource pooling"],"a":[3],"e":"","s":"Topic Resource pooling, the provider’s computing resources are pooled to serve multiple consumers using a multi-tenant model. Each model, each tenant (i.e., customer) shares the different physical and virtual resources dynamically assigned and reassigned according to consumer demand. Examples of resources that can be pooled and shared include storage, processing, memory, and network bandwidth."},{"i":"166","g":0,"q":"Which three types of external ports can be used to connect an external storage device to a computer? (Choose three.)","o":["Thunderbolt","USB","eSATA","SATA","DVI","HDMI"],"a":[0,1,2],"e":"Внешние накопители подключают через Thunderbolt, USB и eSATA; SATA — внутренний, DVI/HDMI — видео.","s":""},{"i":"167","g":0,"q":"Which three computer components require separate cabling for power? (Choose three.)","o":["video graphics cards","USB flash drives","internal SATA hard drives","case and CPU fans","PS2 or USB keyboards","wireless network adapters"],"a":[0,2,3],"e":"Отдельное питание нужно видеокартам, внутренним SATA-дискам и вентиляторам; USB-устройства питаются от шины.","s":""},{"i":"168","g":1,"q":"In which two situations would thin clients be a good choice to meet the end-user computing needs? (Choose two.)","o":["when it is necessary for employees to store large amounts of information for off-line access","in branch offices located in rural areas where broadband Internet is either not available or not reliable","when it is necessary for employees to use tablets with minimal storage and processing capabilities","when installed in an enterprise environment where there is a gigabit LAN and powerful servers","in a small business where employees must install and maintain their own application software"],"a":[2,3],"e":"Тонким клиентам нужны быстрая сеть и мощные серверы; сами они почти не имеют ресурсов (планшеты, офис с гигабитной сетью).","s":""},{"i":"171","g":5,"q":"An employee recently purchased a smartwatch. Following the instructions from the watch manufacturer, the employee downloads the wearable app and installs it on an Android phone. The smartwatch shows that it is in discoverable mode, but the app cannot connect to the watch. What is one issue that might cause this problem?","o":["5G is not active on the Android phone.","NFC communications is not enabled on the smartwatch.","The new smartwatch WiFi connection is faulty.","Bluetooth is disabled on the Android phone."],"a":[3],"e":"Смарт-часы подключаются по Bluetooth — если он выключен на телефоне, приложение их не найдёт.","s":""},{"i":"172","g":0,"q":"Which member of the DDR SDRAM family has the fastest clock rate and consumes the least amount of power?","o":["GDDR5 SDRAM","DDR3 SDRAM","DDR4 SDRAM","DDR2 SDRAM"],"a":[2],"e":"DDR4 — самая быстрая и экономичная в семействе DDR (DDR2 < DDR3 < DDR4).","s":""},{"i":"174","g":4,"q":"A network technician suspects that there may be a short or a termination error in the wiring that connects an Ethernet switch to the network. Which tool would be the best choice for the technician to use to identify the issue?","o":["loopback adapter","tone generator and probe","cable tester","multimeter"],"a":[2],"e":"Кабельный тестер находит короткие замыкания и ошибки обжима.","s":""},{"i":"175","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 110. What service application is the client requesting?","o":["HTTP","POP3","NetBIOS (NetBT)","SMB/CIFS"],"a":[1],"e":"Порт 110 — POP3 — приём почты.","s":""},{"i":"176","g":10,"q":"Why would a university student need to use the taskkill command?","o":["to display a list of current processes running on a local or a remote computer","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to end one or more processes on a PC based on process ID or image name"],"a":[3],"e":"taskkill завершает процессы по ID или имени образа.","s":""},{"i":"177","g":8,"q":"Which term describes a partition scheme that supports storing a backup of a partition table?","o":["basic disk","GPT","logical drive","dynamic disk"],"a":[1],"e":"GPT хранит резервную копию таблицы разделов.","s":""},{"i":"178","g":8,"q":"How can a hard drive that is using an MBR be partitioned in order to support additional logical drives?","o":["Expand the size of the active partition into unallocated space available on the drive.","Make one primary partition an extended partition to contain the logical drives.","Create multiple logical partitions within the active partition.","Create a large dynamic volume that spans more than one disk."],"a":[1],"e":"На MBR-диске один основной раздел делают расширенным, а внутри него создают логические диски.","s":""},{"i":"179","g":2,"q":"A computer technician uses Windows tools to gather information such as system components, operating system, users, and disk drives on multiple systems within the company. Another technician suggests that the tasks would take less time if they were automated. Which two built-in scripting capabilities in Windows enable a technician to run a simple text file, created in Notepad, which contains the necessary commands and variables? (Choose two.)","o":["PowerShell ISE script interpreter","command line batch script interpreter","Linux Bash shell script interpreter","JavaScript client-side scripting language","C++ and C# built-in compiler"],"a":[0,1],"e":"Пакетные (.bat) файлы и PowerShell — встроенные скриптовые средства Windows.","s":""},{"i":"182","g":4,"q":"Why would a lawyer need to use the tracert command?","o":["to verify activity on the PC by displaying all active TCP connections on the device","to query the Domain Name Sysytem (DNS) to get domain names and mapping information","to quickly verify connectivity by sending echo-request messages to the destination and receiving a series of echo-reply messages from that destination","to display a list of the near-side router interfaces between the source device and the destination device"],"a":[3],"e":"tracert показывает маршрут пакетов — список ближайших интерфейсов маршрутизаторов на пути.","s":"tracert – The command traces the route that packets take from your computer to a destination host. At the command prompt, enter tracerthostname. The first listing in the results is your default gateway. Each listing after that is the router that packets are traveling through to reach the destination. Tracert shows you where packets are stopping, indicating where the problem is occurring."},{"i":"183","g":9,"q":"A network analyst is booting a laptop that has Windows 7 installed with cellular SIM slot. The boot process is currently working on the following step: The Windows kernel takes over the boot process. What is thenext step that will happen in the boot process?","o":["WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","NTOSKRNL.EXE starts the login file called WINLOGON.EXE.","The Windows kernel takes over the boot process.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL."],"a":[1],"e":"Правильный следующий шаг: «NTOSKRNL.EXE starts the login file called WINLOGON.EXE.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"Boot Sequence for Windows: - Power on Self Test (POST) - POST for each adapter card that has a BIOS - BIOS reads the MBR - MBR takes over control of the boot process and starts BOOTMGR - BOOTMGR reads the Boot Configuration Data file to know which OS to load and where to find the OS on the boot partition - BOOTMGR invokes WINLOAD.EXE in order to load the NTOSKRNL.EXE file and HAL.DLL - BOOTMGR reads the registry files and loads device drivers - NTOSKRNL.EXE starts the WINLOGON.EXE program and displays the Windows login screen At this point, the NT kernel takes over. The NT kernel is the heart of all Windows operating systems. The name of this file is NTOSKRNL.EXE. It starts the login file called WINLOGON.EXE and displays the Windows Welcome screen."},{"i":"184","g":12,"q":"A company purchases 15 USB flash drives to use for data analysis training for company accountants. The data analysis training requires that actual company data be stored on the drives, so a secure method of erasing the data is needed before the flash drives can be reused for other training classes. What method should the IT technicians use to ensure that the data on the USB flash drives cannot be recovered?","o":["a quick formatting utility to overwrite the data","a degaussing wand to erase the data","a secure erase software utility to wipe the drive","an electromagnetic device to wipe the drive"],"a":[2],"e":"Быстрое форматирование не уничтожает данные — нужна программа безопасного стирания.","s":""},{"i":"187","g":2,"q":"An on-site IT technician needs to work on systems installed in a small health clinic located in New York state. When the technician arrives, the office manager asks if the technician is aware of HIPAA regulations. Which two situations are breaches of PHI and could possibly lead to severe penalties under HIPAA? (Choose two.)","o":["sending the software support technician a text of the error messages that pop up when viewing patient records","sending screenshots of multiple patient health records that contain error messages to a second level technician","making a backup of the clinic patient data in order to recreate the issues on a server in the IT support office","calling the software support help desk and describing an issue occurring when patient records are printed","watching the office manager demonstrate an issue using a copy of the clinic database that contains test data"],"a":[1,2],"e":"Нарушение HIPAA: скриншоты и копии реальных данных пациентов нельзя пересылать или копировать без защиты.","s":""},{"i":"188","g":10,"q":"Why would a manager need to use the del command?","o":["to relocate a file from one Windows directory to another one","to remove an empty directory","to move that file to a different Windows directory while also leaving the file in the current location","to erase one or more files from a Windows directory"],"a":[3],"e":"del удаляет один или несколько файлов.","s":""},{"i":"189","g":7,"q":"A technician is working on a laptop and an app is not responding. What is a possible solution for this situation?","o":["Ensure that Bluetooth is not activated.","Perform a reset.","Ensure that Wi-Fi is turned off.","Ensure that only one app is open at a time."],"a":[1],"e":"Зависшее приложение: выполните сброс (reset) или перезапустите приложение.","s":""},{"i":"190","g":11,"q":"An end user wants to be able to recover an older version of a document that was created earlier in the day. Assuming that Windows Backup is enabled, which Windows 10 function can provide a user access to recover specific versions of a file?","o":["File History","System Restore","Windows Recovery","Reset this PC"],"a":[0],"e":"File History хранит версии файлов и позволяет вернуть более раннюю.","s":""},{"i":"191","g":8,"q":"An IT technician attempts to copy a large file to a USB flash drive that contains other data but the copy fails. The technician checks the properties of the flash drive and finds that it was formatted using FAT32. Which method can the technician use to easily change the file system to NTFS without losing the data files currently stored on the disk?","o":["Open the Command Prompt (Admin) window and use the convert command.","Back up the data on the flash drive, reformat the drive as NTFS, and restore the data.","Use the Disk Management utility on Windows 10 to change the formatting.","Create a new partition on the flash drive and format it as NTFS."],"a":[0],"e":"Команда convert меняет FAT32 на NTFS без потери данных.","s":""},{"i":"192","g":5,"q":"An employee wants to keep a local backup of iPhone data on a Windows laptop. What type of software does the employee need on the laptop to create this backup?","o":["Google sync","Finder","Time Machine","iTunes"],"a":[3],"e":"","s":"Apple mobile devices can be backed up to a Windows PC or Laptop. iOS supports backups on iTunes running on a PC."},{"i":"193","g":11,"q":"What can an IT technician accomplish using the Manage Storage Spaces feature in Windows 8 and 10?","o":["configure RAID controllers in the BIOS","automatically configure disk backup utilities","create storage pools and configure disk arrays","update disk device drivers in the Windows registry"],"a":[2],"e":"Storage Spaces объединяет диски в пулы и создаёт отказоустойчивые массивы.","s":""},{"i":"194","g":11,"q":"While troubleshooting an issue on a customer computer, an on-site technician believes that the problem can be resolved by using Windows Restore. What type of information is not restored when using Windows Restore with a recent restore point snapshot?","o":["device drivers","operating system files","registry entries","user data files","installed program settings"],"a":[3],"e":"Восстановление системы не затрагивает пользовательские файлы (документы).","s":""},{"i":"195","g":9,"q":"A technician is booting a PC that has Windows 10 installed on dynamic drives. The boot process is currently working on the following step: POST. What is the next step that will happen in the boot process?","o":["There are no more steps, the boot process is complete.","NTOSKRNL.EXE starts the login file called WINLOGON.EXE.","WINLOGON.EXE displays the Windows Welcome screen","BIOS locates and reads the configuration settings that are stored in the CMOS memory."],"a":[3],"e":"Правильный следующий шаг: «BIOS locates and reads the configuration settings that are stored in the CMOS memory.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"Boot Sequence for Windows: - Power on Self Test (POST) - POST for each adapter card that has a BIOS - BIOS reads the MBR - MBR takes over control of the boot process and starts BOOTMGR - BOOTMGR reads the Boot Configuration Data file to know which OS to load and where to find the OS on the boot partition - BOOTMGR invokes WINLOAD.EXE in order to load the NTOSKRNL.EXE file and HAL.DLL - BOOTMGR reads the registry files and loads device drivers - NTOSKRNL.EXE starts the WINLOGON.EXE program and displays the Windows login screen At this point, the NT kernel takes over. The NT kernel is the heart of all Windows operating systems. The name of this file is NTOSKRNL.EXE. It starts the login file called WINLOGON.EXE and displays the Windows Welcome screen."},{"i":"196","g":1,"q":"What are two features of multicore processors? (Choose two.)","o":["Applications such as gaming and video editing benefit from having multicore processors available.","Each core in a multicore processor has its own independent connection to reserved RAM.","Multiple single-core processors use less power and generate less heat than a multicore processor does.","Multicore processors can execute instructions more quickly than single-core processors can.","L2 and L3 cache is shared in all types of multicore processors in order to improve performance."],"a":[0,3],"e":"Многоядерные процессоры быстрее выполняют инструкции и полезны для игр и видеомонтажа.","s":""},{"i":"197","g":4,"q":"Which two statements describe characteristics of network addresses? (Choose two.)","o":["A MAC address is also referred to as a physical address because it is permanently embedded on the NIC.","A statically assigned IP address will be valid on any network to which the device connects.","DHCP is used to dynamically assign both MAC and IP addresses to devices connected to the network.","A valid public IPv4 or IPv6 address is needed in order for devices to communicate over the internet.","The MAC address of a device will change when that device moves from one Ethernet network to another."],"a":[0,3],"e":"","s":"Knowing how network addressing works can speed configuration and troubleshooting tasks. MAC addresses are assigned by the NIC manufacturer and remain the same as long as the NIC is not replaced. MAC addresses are used to communicate between devices connected to the same local Ethernet network. Valid IPv4 and IPv6 addresses are necessary for communications to be routed over the internet. All IP addresses are valid only on a network that has the same network prefix bits and the same subnet mask."},{"i":"198","g":5,"q":"An on-site technician is asked to check a laptop used by an executive who occasionally works from home. The technician observes that the image on the laptop screen flickers and appears dull, even though the same image displayed on another monitor attached to the laptop docking station is normal. What are two issues that could cause the symptoms the technician observed? (Choose two.)","o":["The inverter may be failing.","The LCD cutoff switch is damaged.","The laptop is overheating.","The GPU has failed.","The backlight needs adjustment or is failing."],"a":[0,4],"e":"Мерцание и тусклое изображение при нормальном внешнем мониторе — неисправность инвертора или подсветки.","s":""},{"i":"199","g":0,"q":"A technician must replace a power supply. Which two features should the technician consider when selecting the replacement? (Choose two.)","o":["physical size","output voltage less than 3V","UPS support","wattage","support for eSATA"],"a":[0,3],"e":"","s":"When selecting a power supply, make sure the size of power supply is appropriate in that it fits within the case and that it provides the proper amount of wattage for the installed computer parts."},{"i":"200","g":0,"q":"Why is unbuffered memory a better choice than buffered memory for gaming or general use computers?","o":["The additional control circuitry on the unbuffered RAM module speeds up memory reads.","Buffered memory cannot support the larger quantities of RAM that are necessary for gaming computers.","The computer can read data directly from the unbuffered memory banks, making unbuffered memory faster than buffered memory.","The control chip built into the unbuffered RAM module assists the memory controller to manage large amounts of RAM."],"a":[2],"e":"Unbuffered-память читается контроллером напрямую, без буфера, поэтому быстрее — подходит игровым и домашним ПК.","s":""},{"i":"201","g":4,"q":"A UTM appliance, such as a Cisco ASA 5506-X, includes the functionality of which two standalone devices? (Choose two.)","o":["DSL modem","external Storage drive","stateful firewall","IPS/IDS","24-port LAN switch"],"a":[2,3],"e":"UTM (например, Cisco ASA) объединяет stateful-файрвол и IPS/IDS.","s":""},{"i":"202","g":2,"q":"An on-site IT technician is attempting to resolve an issue with application performance on a customer laptop. The technician backs up the customer data and then replaces the memory in the laptop with known good memory. It does not resolve the performance issue. What are the next two actions the technician should take? (Choose two.)","o":["Call the laptop manufacturer technical support line.","Continue to test the next likely probable cause.","Document that the possible solution did not work.","Reinstall the original memory sticks.","Escalate the issue to the next level support technician."],"a":[1,2],"e":"","s":"Knowing what to do when a possible solution does not resolve the problem is part of a good troubleshooting strategy. If you implement a possible solution and it does not correct the problem, you should reverse the action that you just took and document that the possible solution did not solve the issue. Once that is complete, move on to test another potential solution or escalate the issue to the next level."},{"i":"203","g":11,"q":"A user wants VirtualBox to run automatically when Windows 10 starts up. Which action will enable VirtualBox to load and run on system startup?","o":["Copy the shortcut for VirtualBox from its location to the startup folder.","Right click on the application in the Start menu and choose the startup option.","Use msconfig to change the startup option from manual to automatic.","Use the Startup tab in Task Manager to add VirtualBox to the list of programs."],"a":[0],"e":"Ярлык программы в папке автозагрузки (Startup) запускает её при входе в систему.","s":""},{"i":"204","g":2,"q":"An on-site IT technician finished the removal of malware from a customer computer and installed new virus protection software. An hour after the technician left the site, the customer called the help desk to report that a critical web-based application was no longer functioning properly. Which step in the troubleshooting process did the IT technician fail to properly complete?","o":["Document findings and actions.","Identify the problem.","Establish a plan of action.","Test the theory of probable cause.","Verify full system functionality."],"a":[4],"e":"Не выполнен последний шаг — проверка полной работоспособности системы после ремонта.","s":""},{"i":"205","g":6,"q":"What are two characteristics of the hotend nozzle on a 3D printer? (Choose two.)","o":["The hotend nozzle heats to different temperatures depending on the type of filament used.","Hotend nozzles are designed to last the life of the printer and do not need to be replaced.","The heating temperature of the hotend nozzle is the same (190 degrees Celsius) for all materials.","Hotend nozzles are considered consumables and should be replaced during normal maintenance.","Replacing a hotend nozzle can be a complicated and time-consuming process."],"a":[0,3],"e":"Сопло 3D-принтера нагревается по-разному под разные филаменты и является расходником.","s":""},{"i":"207","g":0,"q":"Which type of disk drive can provide a very fast boot experience and also provide high capacity storage?","o":["SSD","DVD","HDD","SSHD"],"a":[3],"e":"","s":"A solid-state hybrid drive (SSHD) is a compromise between a magnetic HDD and an SSD. It combines the best aspects of both technologies, being faster than an HDD but less expensive than an SSD. SSHDs integrate a magnetic HDD with onboard flash memory that serves as a nonvolatile cache. This allows SSHD drives to automatically cache frequently accessed data, speeding up certain operations such as operating system startup. Additionally, SSHD drives can provide more storage space than an SSD, making them an ideal choice for those seeking both speed and high capacity storage."},{"i":"209","g":5,"q":"A technician follows the instruction manual that came with a new Bluetooth speaker to place the speaker in discoverable mode. In this mode, what type of information will the speaker transmit to the laptop in order to start the pairing process?","o":["device name and Bluetooth capabilities","Bluetooth PIN and device ID","protocol and radio frequency settings","username and telephone number"],"a":[0],"e":"","s":"When a Bluetooth device is in discoverable mode, it transmits Bluetooth and device information such as device name, services that the device can use, and Bluetooth class. To prevent a Bluetooth device from being discovered unintentionally, only turn on Bluetooth capabilities when they are needed."},{"i":"210","g":9,"q":"A technician is booting a PC that has Windows 10 installed on dynamic drives. The boot process is currently working on the following step: BIOS locates and reads the configuration settings that are stored in the CMOS memory. What is the next step that will happen in the boot process?","o":["The code in the boot sector is executed and the control of the boot process is given to Windows Boot Manager.","The BIOS boots the computer using the first drive that contains a valid boot sector.","POST.","BIOS locates and reads the configuration settings that are stored in the CMOS memory."],"a":[1],"e":"Правильный следующий шаг: «The BIOS boots the computer using the first drive that contains a valid boot sector.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"After POST, the BIOS locates and reads the configuration settings that are stored in the CMOS memory. The boot device priority, the boot device priority is set in the BIOS and can be arranged in any order. The BIOS boots the computer using the first drive that contains an operating system."},{"i":"211","g":9,"q":"A network analyst is booting a laptop that has Windows 7 installed with cellular SIM slot. The boot process is currently working on the following step: The Windows kernel takes over the boot process. What is the next step that will happen in the boot process?","o":["WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.","WinLoad reads the registry fi
