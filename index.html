<footer>Вопросы и варианты ответов перемешиваются каждый раз 💗</footer>`}
function nextWish(){P.w=(P.w+1)%WISH.length;sv();document.getElementById("wt").textContent=WISH[P.w]}
function topics(){return `<h2 class="sec">Темы</h2><div class="grid">${GR.map((g,k)=>{const l=gq(k),m=mastered(l);return `<button class="card tcard" onclick="startQuiz(${k})"><span class="em">${g.e}</span><b>${g.n}</b><div class="bar"><i style="width:${pct(m,l.length)}%"></i></div><small>${m} / ${l.length} освоено${P.best[k]!=null?` · лучший: ${P.best[k]}%`:""}</small></button>`}).join("")}</div>`}
const mist=()=>QS.filter(q=>P.st[q.i]&&!P.st[q.i].l);
function startMist(){const l=mist();if(!l.length){alert("Ошибок пока нет — отлично! 💗");return}startList("mist",shuf(l),"Работа над ошибками")}
function startQuiz(g){startList(g,shuf(gq(g)),GR[g].e+" "+GR[g].n)}
function startList(key,list,title){S={key,title,list:list.map(prep),i:0,s:0,sel:[],done:false};V={v:"quiz"};render();scrollTo(0,0)}
function quiz(){if(S.fin)return resBox();const p=S.list[S.i],n=S.list.length,m=p.ok.length>1;
const cls=i=>!S.done?(S.sel.includes(i)?"sel":""):(p.ok.includes(i)?"ok":S.sel.includes(i)?"no":"");
return `<div class="card q"><div class="meta">${S.title} · ${S.i+1} / ${n}${m?` · выберите ${p.ok.length}`:""}</div><div class="bar"><i style="width:${S.i/n*100}%"></i></div><h3>${p.q.q}</h3>
${p.opts.map((o,i)=>`<button class="o ${cls(i)}" ${S.done?"disabled":""} onclick="pick(${i})">${o}</button>`).join("")}
${!S.done&&m?`<button class="btn p" onclick="check()">Проверить</button>`:""}
${S.done?`<div class="ex"><b>${S.good?"✅ Верно!":"❌ Не совсем"}</b><br><b>Объяснение:</b> ${p.q.e||p.q.s}${p.q.e&&p.q.s?`<span class="en">EN: ${p.q.s}</span>`:""}</div><div class="row"><button class="btn p" onclick="nxt()">${S.i+1<n?"Дальше →":"Завершить"}</button></div>`:""}</div>`}
function rec(id,ok){const s=P.st[id]||(P.st[id]={c:0,w:0});ok?s.c++:s.w++;s.l=ok;}
function pick(i){if(S.done)return;const p=S.list[S.i];if(p.ok.length>1){S.sel=S.sel.includes(i)?S.sel.filter(x=>x!=i):S.sel.concat(i);return render()}S.sel=[i];check()}
function check(){if(!S.sel.length)return;const p=S.list[S.i];S.done=true;S.good=p.ok.length==S.sel.length&&p.ok.every(x=>S.sel.includes(x));if(S.good)S.s++;rec(p.q.i,S.good);sv();render()}
function nxt(){S.i++;S.done=false;S.sel=[];if(S.i<S.list.length)return render(),scrollTo(0,0);S.fin=true;const p=pct(S.s,S.list.length);if(S.key!="mist")P.best[S.key]=Math.max(P.best[S.key]||0,p);sv();render()}
function resBox(){const p=pct(S.s,S.list.length);return `<div class="card q"><h3 class="script" style="font-size:2rem">Результат</h3><div class="big">${S.s} / ${S.list.length} · ${p}%</div><div class="bar"><i style="width:${p}%"></i></div><p style="text-align:center">${p>=90?"Блестяще! 🌸":p>=70?"Отлично, ты молодец! 💗":"Хороший шаг вперёд — повтори ошибки, и станет лучше ✨"}</p><div class="row" style="justify-content:center"><button class="btn p" onclick="${S.key=="mist"?"startMist()":`startQuiz(${S.key})`}">Ещё раз</button><button class="btn" onclick="go('topics')">К темам</button></div></div>`}
/* cards */
function cards(){V.deck=V.deck??"all";V.only=V.only??false;if(!S||S.kind!="cards"||S.deck!=V.deck||S.only!=V.only){let l=V.deck=="all"?QS:gq(+V.deck);if(V.only)l=l.filter(q=>!P.cards[q.i]);S={kind:"cards",deck:V.deck,only:V.only,list:shuf(l),i:0,f:false}}
const n=S.list.length,known=Object.keys(P.cards).length;
const sel=`<select onchange="V.deck=this.value;S=null;render()"><option value="all" ${V.deck=="all"?"selected":""}>Все темы (${QS.length})</option>${GR.map((g,k)=>`<option value="${k}" ${V.deck==k?"selected":""}>${g.e} ${g.n}</option>`).join("")}</select>`;
const top=`<div class="row" style="margin:0 0 8px">${sel}<label><input type="checkbox" ${V.only?"checked":""} onchange="V.only=this.checked;S=null;render()"> только не выученные</label></div>`;
if(!n)return top+`<div class="card"><h3>Все карточки в этой колоде выучены 🎉</h3></div>`;
const q=S.list[S.i],ans=q.a.map(i=>q.o[i]);
return top+`<div class="meta">Карточка ${S.i+1} / ${n} · выучено всего: ${known} из ${QS.length}</div><div class="flip"><div class="fc ${S.f?"f":""}" onclick="S.f=!S.f;render()"><div class="face fr"><h3>${q.q}</h3><div class="hint">Нажми, чтобы перевернуть${q.a.length>1?` · ответов: ${q.a.length}`:""}</div></div><div class="face bk"><b>Ответ:</b><ul style="margin:6px 0 10px;padding-left:20px">${ans.map(a=>`<li>${a}</li>`).join("")}</ul><div>${q.e||q.s}</div></div></div></div>
<div class="row" style="justify-content:center"><button class="btn" onclick="cprev()">←</button><button class="btn w" onclick="cmark(0)">Повторить 🔁</button><button class="btn g" onclick="cmark(1)">Знаю 💚</button><button class="btn" onclick="cnext()">→</button></div>`}
function cnext(){S.i=(S.i+1)%S.list.length;S.f=false;render()}function cprev(){S.i=(S.i-1+S.list.length)%S.list.length;S.f=false;render()}
function cmark(k){const id=S.list[S.i].i;k?P.cards[id]=1:delete P.cards[id];sv();if(S.only&&k){S.list.splice(S.i,1);if(S.i>=S.list.length)S.i=0;S.f=false;if(!S.list.length)S=null;return render()}cnext()}
/* mock */
function mockintro(){return `<div class="card"><h3 class="script" style="font-size:2rem">Пробный финал 🎓</h3><p>40 случайных вопросов из всех тем. Ответы показываются только в конце, как на настоящем экзамене. Порядок вопросов и вариантов каждый раз новый. Проходной балл — 70%.</p><div class="row"><button class="btn p" onclick="startMock()">Начать</button></div></div>`+(P.mock.length?`<h2 class="sec">Прошлые попытки</h2>${mockTable()}`:"")}
function mockTable(){return `<div class="card"><table><tr><th>Дата</th><th>Результат</th><th>Время</th></tr>${P.mock.slice().reverse().slice(0,10).map(m=>`<tr><td>${new Date(m.d).toLocaleDateString("ru-RU")}</td><td><span class="pill ${m.p>=70?"ok":"no"}">${m.s}/${m.n} · ${m.p}%</span></td><td>${Math.floor(m.t/60)} мин</td></tr>`).join("")}</table></div>`}
function startMock(){const seen={},pool=shuf(QS).filter(q=>{const n=q.i.replace(/\D/g,"");if(seen[n])return false;seen[n]=1;return true}).slice(0,40);S={kind:"mock",list:pool.map(prep),ans:pool.map(()=>[]),i:0,t0:Date.now()};V={v:"mock"};render();scrollTo(0,0)}
function mock(){const p=S.list[S.i],n=S.list.length,m=p.ok.length>1,a=S.ans[S.i];
return `<div class="card q"><div class="meta">Пробный финал · вопрос ${S.i+1} / ${n}${m?` · выберите ${p.ok.length}`:""}</div><div class="bar"><i style="width:${S.ans.filter(x=>x.length).length/n*100}%"></i></div><h3>${p.q.q}</h3>
${p.opts.map((o,i)=>`<button class="o ${a.includes(i)?"sel":""}" onclick="mpick(${i})">${o}</button>`).join("")}
<div class="row"><button class="btn" onclick="mgo(-1)" ${S.i?"":"disabled"}>← Назад</button>${S.i<n-1?`<button class="btn p" onclick="mgo(1)">Дальше →</button>`:`<button class="btn g" onclick="mfin()">Завершить 🎓</button>`}</div>
<div class="dots">${S.list.map((_,k)=>`<button class="${S.ans[k].length?"a":""} ${k==S.i?"c":""}" onclick="S.i=${k};render()">${k+1}</button>`).join("")}</div></div>`}
function mpick(i){const p=S.list[S.i],a=S.ans[S.i];if(p.ok.length>1)S.ans[S.i]=a.includes(i)?a.filter(x=>x!=i):a.concat(i);else S.ans[S.i]=[i];render()}
function mgo(d){S.i+=d;render();scrollTo(0,0)}
function mfin(){const un=S.ans.filter(x=>!x.length).length;if(un&&!confirm(`Без ответа осталось: ${un}. Завершить?`))return;let sc=0;S.res=S.list.map((p,k)=>{const ok=p.ok.length==S.ans[k].length&&p.ok.every(x=>S.ans[k].includes(x));if(ok)sc++;rec(p.q.i,ok);return ok});const n=S.list.length,t=Math.round((Date.now()-S.t0)/1000);S.sc=sc;P.mock.push({d:Date.now(),s:sc,n,p:pct(sc,n),t});sv();V={v:"mockres"};render();scrollTo(0,0)}
function mockres(){const n=S.list.length,p=pct(S.sc,n);return `<div class="card q"><h3 class="script" style="font-size:2rem">Результат финала</h3><div class="big">${S.sc} / ${n} · ${p}%</div><div class="bar"><i style="width:${p}%"></i></div><p style="text-align:center">${p>=70?"Сдано! Ты умничка 💗":"Чуть-чуть не дотянули до 70% — разбери ошибки ниже и попробуй ещё ✨"}</p><div class="row" style="justify-content:center"><button class="btn p" onclick="startMock()">Новый финал</button><button class="btn" onclick="go('home')">Домой</button></div></div>
<h2 class="sec">Разбор</h2>${S.list.map((p,k)=>`<div class="rev"><span class="pill ${S.res[k]?"ok":"no"}">${S.res[k]?"верно":"ошибка"}</span> <b>${k+1}.</b> ${p.q.q}<ul style="margin:8px 0;padding-left:20px">${p.opts.map((o,i)=>`<li style="${p.ok.includes(i)?"color:var(--mintd);font-weight:800":S.ans[k].includes(i)?"color:var(--badd)":""}">${o}${p.ok.includes(i)?" ✔":S.ans[k].includes(i)?" ✘":""}</li>`).join("")}</ul><div class="ex" style="margin:0"><b>Объяснение:</b> ${p.q.e||p.q.s}${p.q.e&&p.q.s?`<span class="en">EN: ${p.q.s}</span>`:""}</div></div>`).join("")}`}
/* progress */
function prog(){const all=mastered(QS),seen=Object.keys(P.st).length;let c=0,w=0;Object.values(P.st).forEach(s=>{c+=s.c;w+=s.w});
return `<h2 class="sec">Мой прогресс</h2><div class="card"><div class="big">${pct(all,QS.length)}%</div><div class="bar"><i style="width:${pct(all,QS.length)}%"></i></div><p style="text-align:center;margin:0">Освоено ${all} из ${QS.length} · отвечала на ${seen} вопросов · точность ${pct(c,c+w)}% · карточек выучено ${Object.keys(P.cards).length}</p></div>
<h2 class="sec">По темам</h2><div class="card">${GR.map((g,k)=>{const l=gq(k),m=mastered(l);return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>${g.e} ${g.n}</span><b>${m}/${l.length}</b></div><div class="bar"><i style="width:${pct(m,l.length)}%"></i></div></div>`}).join("")}</div>
${P.mock.length?`<h2 class="sec">Пробные финалы</h2>${mockTable()}`:""}
<div class="row" style="justify-content:center;margin-top:22px"><a class="lnk" onclick="if(confirm('Сбросить весь прогресс?')){P={st:{},best:{},mock:[],cards:{},w:0,th:P.th};sv();render()}">Сбросить прогресс</a></div>`}
render();
</script></body></html>
