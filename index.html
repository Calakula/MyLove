Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":""},{"i":"216","g":9,"q":"A user is booting a desktop that has Windows 10 installed that also uses an extended partition. The boot process is currently working on the following step: The code in the boot sector is executed and the control of the boot process is given to Windows Boot Manager. What is the next step that will happen in the boot process?","o":["WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.","The BIOS boots the computer using the first drive that contains a valid boot sector.","The code in the boot sector is executed and the control of the boot process is given to Windows Boot Manager.","Winload uses the path specified in BOOTMGR to find the boot partition."],"a":[3],"e":"Правильный следующий шаг: «Winload uses the path specified in BOOTMGR to find the boot partition.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":""},{"i":"217","g":5,"q":"A technician is working on a laptop and an app is not loading. What is a possible solution for this situation?","o":["Perform a reset.","Ensure that only one app is open at a time.","Check the display settings.","Check the screen refresh rate."],"a":[1],"e":"Приложение не загружается — закройте лишние и оставьте открытым только нужное.","s":""},{"i":"218","g":8,"q":"Which term describes a file system that supports a partition size up to 2 TB?","o":["FAT32","formatting","dynamic disk","basic disk"],"a":[0],"e":"","s":"File Allocation Table, 32 bit (FAT32) - Supports partition sizes up to 2 TB or 2,048 GB. The FAT32 file system is used by Windows XP and earlier OS versions."},{"i":"219","g":10,"q":"Why would a technician need to use the copy command?","o":["to copy files, directories, and subdirectories from one location to another","to move that file to a different Windows directory while also leaving the file in the current location","to copy a group of files from one Windows directory to another","to relocate a file from one Windows directory to another one"],"a":[0],"e":"copy копирует файлы из одного места в другое.","s":""},{"i":"222","g":8,"q":"Which two tools are available to transfer user data and settings from an old Windows computer to a Windows operating system on a new computer? (Choose two.)","o":["Windows Easy Transfer","Windows User Manager","Windows Upgrade Assistant","Windows Upgrade Advisor","User State Migration tool"],"a":[0,4],"e":"","s":"When a new operating system is being installed, existing user data and settings need to be migrated from the old to the new operating system. The User State Migration Tool and the Windows Easy Transfer Tool are available to perform this task on the Windows Vista, 7, and 8 operating systems."},{"i":"223","g":8,"q":"A user wants to extend a primary partition formatted with the NTFS file system with the unallocated space on the hard disk. What must the user do after the primary partition is extended to make it usable?","o":["Convert the disk type to dynamic.","Ensure that the disk type is basic.","Format the disk with the FAT64 file system.","Partition the new space as a basic disk."],"a":[0],"e":"","s":"A partition must be formatted with the NTFS file system in order to extend it by using the unallocated space on the disk. Once the partition has been extended, the disk type must be converted to a dynamic disk in order for the new partition to be accessible."},{"i":"224","g":8,"q":"Why is a full format more beneficial than a quick format when preparing for a clean OS installation?","o":["A full format is the only method of installing Windows 8.1 on a PC that has an operating system currently installed.","A full format will delete files from the disk while analyzing the disk drive for errors.","A full format will delete every partition on the hard drive.","A full format uses the faster FAT32 file system, whereas a quick format uses the slower NTFS file system."],"a":[1],"e":"","s":"A full format removes files from a partition while scanning the disk for bad sectors. A quick format will remove files from a partition but does not scan a disk for bad sectors."},{"i":"225","g":8,"q":"A technician wishes to prepare the computers in the network for disaster recovery. The network consists of a variety of desktops and laptops from different vendors. All the computers are running either a 32-bit version of Windows 10 Pro or a 64-bit version of Windows 10 Pro. How would the technician prepare the recovery media?","o":["Prepare one 64-bit recovery disc for all the computers.","Prepare one 32-bit recovery disc for all the computers.","Prepare individual recovery discs for all the computers.","Prepare one image restore for all the computers."],"a":[2],"e":"","s":"All the PCs are from different vendors and thus have dissimilar hardware configurations. Furthermore, all the PCs have a variety of 32-bit Windows 10 and 64-bit Windows 10. Because the PCs have different versions of the OS and dissimilar hardware, you cannot use the same image on all the PCs . In order to use a single image, Sysprep must be used to strip out machine specific information like the SID, and all PCs must have the same hardware configuration and the same version of the Windows operating system."},{"i":"226","g":8,"q":"A technician wishes to deploy Windows 10 Pro to multiple PCs through the remote network installation process. The technician begins by connecting the new PCs to the network and booting them up. However, the deployment fails because the target PCs are unable to communicate with the deployment server. What is the possible cause?","o":["The wrong network drivers are loaded in the image file.","The SID has not been changed in the image file.","The NIC cards on the new PCs are not PXE-enabled.","Sysprep was not used before building the image file."],"a":[2],"e":"","s":"The NIC cards on the new PCs have to be PXE-enabled in order for them to communicate with the remote installation services on the server."},{"i":"227","g":8,"q":"Which condition is required when planning to install Windows on a GPT disk?","o":["The computer must be UEFI-based.","Only one primary partition can contain an OS.","The maximum partition size cannot exceed 2 TB.","The maximum number of primary partitions that can co-exist is 4."],"a":[0],"e":"","s":"The globally unique identifier (GUID) partition table (GPT) makes use of a number of modern techniques to expand on the older MBR partitioning scheme. GPT is commonly used in computers with UEFI firmware. For Windows 10 to be installed on, and boot, from a GPT disk UEFI must be used."},{"i":"228","g":8,"q":"A technician wishes to perform a customized unattended network installation of Windows 10 on a PC. The requirements include the installation of specific applications and device drivers through the use of an answer file. What would the technician use to create the answer file?","o":["Recovery partition","Windows SIM","disk cloning","System Restore"],"a":[1],"e":"","s":"To perform a custom Windows Unattended installation, setup.exe must be run with the user options found in the answer file. Additional packages, such as applications or drivers, can be added to the answer file. The Windows System Image Manager (SIM) is used to create the setup answer file."},{"i":"229","g":8,"q":"An organization has purchased a custom application for the sales staff that can only be installed on a 64-bit Windows operating system. Each member of the sales staff has a Windows 8.1 32-bit PC. What must the IT department do in order to install and run the application on the sales staff computers?","o":["Downgrade the 32-bit Windows 8.1 to 64-bit Windows 7.","Upgrade the 32-bit Windows 8.1 to 64-bit Windows 10.","Perform a clean installation of 64-bit Windows 10.","Download and install 64-bit hardware drivers in the current OS."],"a":[2],"e":"","s":"A 32-bit OS cannot be upgraded to a 64-bit OS. In this case a clean install of Windows 64-bit would be the only option because the application requires a 64-bit Windows environment to work."},{"i":"233","g":11,"q":"What are two possible solutions to any Windows computer restarting continuously and never displaying the desktop? (Choose two.)","o":["Upgrade the processor.","Press F8 to open the Advanced Options menu and choose Disable Automatic Restart on System Failure.","Access the BIOS and change the boot order options.","Run chkdsk /F /R from the recovery console.","Upgrade the video card.","Reset the hard drive jumpers."],"a":[1,3],"e":"","s":"Upgrading the processor, upgrading the video card, or resetting the hard drive jumper would not fix this problem. Boot order settings cannot cause the system to reboot continuously."},{"i":"234","g":8,"q":"A technician uses Microsoft Deployment Image Servicing and Management (DISM) tool to create a Windows image file on one of the workstations running Windows 10. When the technician tries to clone another workstation with the image file, the workstation exhibits network connectivity issues on completion. What could cause this?","o":["The SID of the original PC is not cleared when creating the image with DISM.","The technician used the wrong tool to create the image file.","The network drivers were not added to the image file.","The Sysprep utility should have been turned off prior to the creation of the image file."],"a":[0],"e":"","s":"The technician must use Sysprep to clean up the local specific configuration, such as the SID, otherwise the cloned systems will not work properly."},{"i":"235","g":11,"q":"A user complains that user files cannot be synced with the network file server while the user is traveling out of the office. The user had access to the internet but no access to the company network server. How can this be addressed?","o":["Ensure that the user only uses a single device and not multiple devices when accessing networked files.","Turn off the activation of Offline Files feature in the Sync Center.","Setup a Sync partnership with the networked file location.","Setup a Sync partnership between the network server, Microsoft OneDrive, and the user."],"a":[3],"e":"","s":"Because the user has access to the internet, access to the Microsoft OneDrive cloud based service is possible and thus the user can sync with Microsoft OneDrive, which in turn can sync with the company network server from across the internet."},{"i":"236","g":11,"q":"A technician has connected a new internal hard drive to a Windows 10 PC. What must be done in order for Windows 10 to use the new hard drive?","o":["Initialize the new hard drive.","Extend the partition on an existing hard drive to the new hard drive.","Run chkdsk on the new hard drive.","Mount the new hard drive."],"a":[0],"e":"","s":"The new hard drive needs to be initialized before it can be used in Windows. This will involve formatting the disk which will erase any existing data on the drive."},{"i":"237","g":11,"q":"What service does PRINT$ provide?","o":["It provides a network share for accessing shared printers.","It provides printer drivers for printer administrators.","It provides a group of hidden printers that only administrative users have permissions to send print jobs to.","It provides an administrative Printer share accessible by all local user accounts."],"a":[1],"e":"","s":"PRINT$ is a hidden share for printer drivers. It is shared by default and used to access remote shared printers or provide drivers to clients when sharing a printer."},{"i":"238","g":11,"q":"A technician is troubleshooting a Windows 10 laptop infected with a virus that has damaged the master boot record. The technician has booted the laptop using the installation media and is attempting to repair the laptop from the command line interface. Which command can the technician use to repair the corrupt master boot record?","o":["bootrec /fixmbr","chkdsk","msconfig","sfc /scannow"],"a":[0],"e":"","s":"The sfc /scannow command is used to check the integristy of the system files. The msconfig command allows for viewing the startup configuration mode, while the chkdsk command is used to repair the Windows file system. The bootrec /fixmbr command is used to repair a corrupt master boot record in a Windows 10 environment."},{"i":"239","g":8,"q":"A user reports that a Windows 10 PC displays the error message “Invalid Boot Disk” during the boot process. The IT technician attempts to boot the computer and finds that the error message occurs immediately after the POST. What could be the possible cause?","o":["A recently installed device driver is incompatible with the boot controller.","BOOTMGR is corrupted.","The MBR/GPT is corrupted.","A service failed to start during the booting process."],"a":[2],"e":"","s":"The message “invalid Boot Disk” could be a symptom of a missing or damaged MBR/GPT, a missing or damaged Boot Configuration Data file, a boot sector virus, a boot order not set correctly in BIOS, media without an operating system being in a drive, a hard drive not detected or damaged, or the absence of an installed operating system."},{"i":"240","g":3,"q":"Which port number is used by Virtual Network Computing (VNC) to provide remote screen sharing between devices?","o":["22","23","389","3389","5900"],"a":[4],"e":"","s":"Virtual Network Computing (VNC) is a freeware product that is similar in functionality to RDP and works over port 5900."},{"i":"241","g":7,"q":"Which feature is included with macOS and provides the ability for a remote user to view and change files, folders, and applications on the local computer?","o":["Screen Sharing","Remote Assistance","Virtual Network Computing","Remote Desktop"],"a":[0],"e":"","s":"In macOS, remote access functionality is provided by the Screen Sharing feature, which is based on Virtual Network Computing (VNC). VNC is a freeware product that is similar in functionality to RDP and works over port 5900."},{"i":"242","g":2,"q":"Which area of concern falls under the operations and planning category in IT documentation?","o":["inventory management","disaster recovery policies and procedures","logical and physical network topology diagrams","end-user manual for hardware and software"],"a":[0],"e":"","s":"There are four broad categories of IT documentation: Policies, Operations, Projects, and User documentation. Operations is concerned with inventory management."},{"i":"244","g":2,"q":"Which two actions should a technician take if illegal content, such as child pornography, is discovered on the hard drive of a customer computer? (Choose two.)","o":["Confront the customer immediately.","Remove and destroy the hard drive.","Contact a first responder.","Shut down the computer until authorities arrive.","Document as much information as possible."],"a":[2,4],"e":"","s":"If illegal content is found, begin documentation to build a chain of custody and contact a first responder immediately."},{"i":"245","g":2,"q":"What are three pieces of information a level one technician should gather from a customer? (Choose three.)","o":["contact information","description of the problem","details of any recent changes to the computer","output from diagnostic software","output from a remote connection to the customer computer","current CMOS settings"],"a":[0,1,2],"e":"","s":"A level one technician should gather information from the customer and solve simple problems. For more advanced diagnostics, opening the computer case, running diagnostics software, and performing remote connections, the problem should be escalated to a level two technician."},{"i":"246","g":2,"q":"What two actions are appropriate for a support desk technician to take when assisting customers? (Choose two.)","o":["Interrupt customers if they start to solve their own problems.","Comfort a customer by minimizing the customer problem.","Let a customer finish talking before asking additional questions.","If you have to put the customer on hold, ask the customer for permission.","As soon as you detect customer anger, pass the angry customer to the next level."],"a":[2,3],"e":"","s":"When dealing with customers, a technician should show professionalism in all aspects. A technician should observe the process before putting a customer on hold. First, let the customer finish speaking. Then, explain that there is need to put the customer on hold for a short period, and ask the customer for permission to do so. Tell the customer that it will be only a few minutes and explain what you will do during the period. When the customer agrees to be put on hold, thank the customer."},{"i":"247","g":2,"q":"A support desk technician is dealing with an angry customer. Which two approaches should the technician take in dealing with the customer? (Choose two.)","o":["Ask socially related questions to direct the customer away from the problem.","Work to redirect the conversation to solving the problem.","Immediately transfer the customer to a higher level technician.","Reply to the customer with the same level of anger.","Let the customer explain the problem without interrupting."],"a":[1,4],"e":"","s":"Angry customers should be allowed to explain the problem, then be redirected to discussing how the problem can be solved. Transferring the customer, replying in a rude tone, and asking unrelated questions will usually increase, not ease, the anger being expressed by the customer."},{"i":"248","g":2,"q":"What two kinds of problems should be escalated from a level one technician to a level two technician? (Choose two.)","o":["problems that require rebooting the equipment","problems that can be solved in a short time","problems that are complicated and will take a long time to resolve","problems that do not fit into the “down call” category","problems that are beyond the scope of the knowledge of the level one technician"],"a":[2,4],"e":"","s":"A problem should be escalated to a level two technician when the problem is going to take a long time to fix, is affecting a large number of users, or requires knowledge or expertise that the level one technician does not possess."},{"i":"249","g":2,"q":"An IT technician in a service company has provided extensive remote IT support with product deployment for a customer. After the completion of the contract, a complaint is filed against the IT technician for not following company policy by sending unsolicited emails about services and products that are not related to the contract. What two things should the IT support technician have done differently? (Choose two.)","o":["The IT technician should have researched the company policy about personal communication with customers on company time.","The IT technician should have used encryption to hide the purpose of the emails.","The IT technician should have added the customer to a chain letter with many recipients instead.","The IT technician should have asked the customer if the customer was interested in receiving information regarding other new services and products.","The IT technician should have requested permission from a supervisor to send the customer emails."],"a":[0,4],"e":"","s":"While working with customers both briefly and over an extended period of time, it is possible to form friendly relationships. It is important to always follow company policy and never send unsolicited messages to a customer. Also do not send unsolicited mass mailings or chain letters to customers from a company email address. Any personal relationships should be kept via personal email accounts and should not reflect the IT organization of the employer."},{"i":"250","g":3,"q":"A third-party security firm is performing a security audit of a company and recommends the company utilize the Remote Desktop Protocol. What are two characteristics of the Microsoft Remote Desktop Protocol (RDP)? (Choose two.)","o":["RDP connects on TCP port 22.","RDP requires a Windows client.","RDP uses an encrypted session.","RDP is a command-line network virtual terminal protocol.","RDP connects on TCP port 3389."],"a":[2,4],"e":"","s":"The Remote Desktop protocol (RDP) is used to remotely access a Windows OS. It is a client/server protocol.The port number for RDP is TCP port 3389 and it uses encryption."},{"i":"251","g":2,"q":"Which subject area describes collecting and analyzing data from computer systems, networks, and storage devices, as part of an investigation of alleged illegal activity?","o":["cyber law","computer forensics","cryptography","disaster recovery"],"a":[1],"e":"","s":"The field of computer forensics involves collecting and analyzing data from computer systems, networks, wireless communications, and storage devices."},{"i":"252","g":2,"q":"In a computer forensics investigation, which type of data is considered volatile data and can be lost if power is removed from the computer?","o":["data stored on magnetic disks","data stored on an internal drive","data in transit between RAM and the CPU","data stored on an external drive"],"a":[2],"e":"","s":"Volatile data is a data that is lost when power is turned off, and is located in temporary storage such as RAM, cache, CPU or in transit between them."},{"i":"253","g":2,"q":"Refer to the exhibit. During the troubleshooting of software that is installed on a computer system, a level one technician requires help from a level two technician. The file shown in the exhibit must be sent to the level two technician. How should the level one technician deliver this file?","o":["This file should not be shared with the level two technician.","Replace all passwords in the file with &lt;password omitted> before emailing the file and then supply the passwords by secure means, if required.","Send the file as it is to the level two technician.","Deliver the file in printed format only."],"a":[1],"e":"","s":"Customer privacy should be maintained. The easiest way to preserve it is removing any occurrence of passwords from the documentation that is being sent to another technician. If a client password is required to solve the problem, it should be sent to another technician through a specific document."},{"i":"254","g":2,"q":"What skill is essential for a level one technician to have?","o":["the ability to gather relevant information from the customer and pass it to the level two technician so it can be entered into the work order","the ability to ask the customer relevant questions, and as soon as this information is included in the work order, escalate it to the level two technician","the ability to translate a description of a customer problem into a few succinct sentences and enter it into the work order","ability to take the work order prepared by the level two technician and try to resolve the problem"],"a":[2],"e":"","s":"The level one technician must be able to translate the description of a customer problem into a succinct sentence or two that is entered into the work order."},{"i":"255","g":2,"q":"What is used to control illegal use of software and content?","o":["chain of custody","service level agreement","End User License Agreement","digital rights management"],"a":[3],"e":"","s":"Digital rights management, or DRM, is software that is designed to prevent illegal access to digital content."},{"i":"256","g":2,"q":"What determines the level of support that a call center technician will provide to an individual customer?","o":["Support is based on the SLA for that customer.","All customers receive the same level of support by the call center.","A level one technician will provide a higher level of support than a level two technician.","An individual call center technician chooses the level of support based on the time available to assist the customer."],"a":[0],"e":"","s":"A call center technician must provide the level of support that is outlined in the SLA for that individual customer."},{"i":"257","g":2,"q":"A bench technician enters the server room and finds the backup server computer case open. The hard drives containing patient medical data are all physically disconnected from the motherboard and the SATA data cables are hanging outside the case. Which step should the technician immediately take?","o":["Reconnect the SATA data cables to ensure continued data backup.","Disconnect the SATA power cables to prevent the loss of persistent data.","Place the hard drives in an external enclosure and begin backing up the data before releasing the drives to first responders.","Locate an employee qualified to collect evidence.","Dust the server computer case for fingerprints."],"a":[3],"e":"","s":"When a potential crime scene is found, a chain of custody must be observed and followed. The technician should immediately locate another employee who is qualified to collect evidence. Disconnecting or reconnecting the drives or attempting to move data may adversely affect the chain of custody."},{"i":"258","g":2,"q":"What is the difference between a scripting language and a compiled language?","o":["Scripting languages need to be converted into executable code using a compiler, while compiled languages are interpreted as they are executed.","Compiled languages are executed by the operating system, while scripting languages are executed by the CPU.","Scripting languages are interpreted and executed line by line when a script is run, while compiled languages need to be converted into executable code.","Compiled languages are executed by a command interpreter, while scripting languages are executed by the CPU."],"a":[2],"e":"","s":"A scripting language is different than a compiled language because each line is interpreted and then executed when the script is run. Compiled languages need to be converted into executable code using a compiler. Another difference between the two types of languages is that compiled languages are executed by the CPU while scripting languages are executed by a command interpreter or by the operating system."},{"i":"259","g":12,"q":"Which methods can be used to implement multifactor authentication?","o":["VPNs and VLANs","IDS and IPS","passwords and fingerprints","tokens and hashes"],"a":[2],"e":"","s":"A cybersecurity specialist must be aware of the technologies available that support the CIA triad."},{"i":"260","g":12,"q":"When responding to a call from a customer who is experiencing problems with a computer, the technician notices that a number of system files on the computer have been renamed. Which two possible solutions could the technician implement to resolve the problem? (Choose two.)","o":["Use antivirus software to remove a virus.","Restore the computer from a backup.","Change the folder and file permissions of the user.","Reset the password of the user.","Upgrade the file encryption protocol."],"a":[0,1],"e":"","s":"Renamed system files are usually the result of a virus on the computer. Removing the virus and restoring the computer from a backup are the only two possible solutions in this case."},{"i":"261","g":12,"q":"A technician suspects that a security issue is causing problems with a computer. What two actions could be performed to test theories of probable cause when troubleshooting the PC? (Choose two.)","o":["Log in as a different user.","Disconnect the computer from the network.","Search helpdesk repair logs for more information.","Discuss solutions with the customer.","Ask the customer open-ended questions about the problem."],"a":[0,1],"e":"","s":"Several actions can be taken by a technician when security issues are suspected as the possible cause of a problem with a computer. Logging in as a different user or disconnecting the PC from the network to isolate the cause of the problem are two possible actions."},{"i":"262","g":12,"q":"The CIO wants to secure data on company laptops by implementing file encryption. The technician determines the best method is to encrypt each hard drive using Windows BitLocker. Which two things are needed to implement this solution? (Choose two.)","o":["at least two volumes","USB stick","password management","TPM","EFS","backup"],"a":[0,3],"e":"","s":"Windows provides a method to encrypt files, folders, or entire hard drives depending on need. However, certain BIOS settings and configurations are necessary to implement encryption on an entire hard disk."},{"i":"263","g":12,"q":"What is an accurate description of asymmetric encryption technology?","o":["Asymmetric encryption is an encryption process that compares traffic on both ends to make sure the traffic has not been altered.","It is an encryption process that uses identical keys on both ends to establish the VPN.","It is an encryption protocol that is used to encrypt data as the data is sent over the VPN.","It is an encryption process that uses a public and private key pair to encrypt/decrypt data."],"a":[3],"e":"Асимметричное шифрование использует пару ключей — открытый и закрытый.","s":""},{"i":"264","g":12,"q":"Which type of security threat can be transferred through email and is used to gain sensitive information by recording the keystrokes of the email recipient?","o":["adware","Trojan","worm","virus","grayware"],"a":[1],"e":"","s":"Adware does not record keystrokes. A worm self-replicates across the network. A Trojan appears to be a legitimate program while carrying malware, and grayware is a general term for software that may be malware."},{"i":"265","g":12,"q":"A manager reports that unusual things are happening on a Windows computer. The technician determines that malware is the culprit. What can the technician do to remove stubborn malware?","o":["Ensure that the computer is connected to the wired network so that antimalware updates can be installed.","Enter Safe Mode and do a system restore.","Install adware protection.","Train the user on identifying trusted and untrusted sources."],"a":[1],"e":"","s":"Booting the computer in Safe Mode prevents most drivers from loading. Additional antimalware software can then be installed to remove or quarantine malware. Sometimes the storage drive must be wiped, the operating system reinstalled, and data restored from a backup."},{"i":"266","g":12,"q":"An employee that has worked at the company for many years has started a home-based business selling crafts. While leaving an office meeting, a company supervisor notices the employee buying supplies for the personal crafting business of the employee. What section of the security policy should the supervisor review when determining how to handle this situation?","o":["acceptable use policies","identification and authentication policies","incident handling policies","remote access policies"],"a":[0],"e":"","s":"The acceptable use policies section of a security policy commonly identifies network resources and usages that are acceptable to the organization. They might also state the ramifications that can occur if this security policy is violated."},{"i":"267","g":12,"q":"What Windows utility should be used to configure password rules and account lockout policies on a system that is not part of a domain?","o":["Event Viewer security log","Local Security Policy tool","Active Directory Security tool","Computer Management"],"a":[1],"e":"","s":"A technician must be aware of the technologies and measures that are used as countermeasures to protect the organization from threats and vulnerabilities. A Windows Domain Security Policy is used and applied when a user logs in to a computer that is on a corporate network. A Windows Local Security Policy is used for stand-alone computers to enforce security settings."},{"i":"268","g":1,"q":"A customer brings in a computer that is asking for a password as soon as it powers on, even before the operating system boots. Which type of password is enabled?","o":["BIOS","login","multifactor","network","synchronous"],"a":[0],"e":"","s":"A BIOS password is configured by entering the BIOS Setup program. If unknown, it can be removed by placing a jumper over two motherboard pins. Some motherboards support BIOS password removal by removing the CMOS battery, but if this is done, all BIOS settings will be reset to the default values."},{"i":"269","g":0,"q":"When attempting to improve system performance for Linux computers with a limited amount of memory, why is increasing the size of the swap file system not considered the best solution?","o":["A swap file system only supports the ex2 file system.","A swap file system does not have a specific file system.","A swap file system cannot be mounted on an MBR partition.","A swap file system uses hard disk space to store inactive RAM content."],"a":[3],"e":"","s":"The swap file system is used by Linux when it runs out of physical memory. When needed, the kernel moves inactive RAM content to the swap partition on the hard disk. Storing and retrieving content in the swap partition is much slower than RAM is, and therefore using the swap partition should not be considered the best solution to improving system performance."},{"i":"270","g":5,"q":"What are three features of GPS on mobile devices? (Choose three.)","o":["phone number lookup","navigation","specialized search results","device tracking","remote wipe","gas mileage calculations"],"a":[1,2,3],"e":"","s":"Navigation, specialized search results, and device tracking are features of GPS on mobile devices. Remote wipe may be a feature on some mobile devices, but is not related to GPS. Phone number lookup and gas mileage calculations are not GPS features."},{"i":"271","g":7,"q":"Which three components are used to assign file and directory permissions in Linux systems? (Choose three.)","o":["root","group","owner","all users","super group","admin group"],"a":[1,2,3],"e":"","s":"In Linux, file and directory permissions are assigned as follows: Owner – the owner user of the file or directory Group – the user group that has been assigned to the file or directory All users – all other users on the system"},{"i":"272","g":7,"q":"A user downloads a widget onto his Android phone but is puzzled to see that when the widget is touched an app is launched. What is a possible cause?","o":["The user has downloaded a virus.","The widget is corrupt.","The security settings of the Android OS have been compromised.","The widget is associated with the app and this is the normal behavior."],"a":[3],"e":"","s":"Widgets are programs that when installed associate with the application they were built for. This will cause the application to launch when the widget icon is touched on the touchscreen of the Android device."},{"i":"273","g":7,"q":"What is the purpose of running mobile device apps in a sandbox?","o":["to enable the phone to run multiple operating systems","to prevent malicious programs from infecting the device","to enable separate app icons to be displayed on the home screen","to bypass phone carrier restrictions that prevent access to unauthorized apps"],"a":[1],"e":"","s":"Mobile device apps are run in a sandbox that isolates them from other resources. Bypassing the phone carrier from preventing access to unauthorized apps is jailbreaking or rooting the device."},{"i":"274","g":7,"q":"Which built-in tool is available on a Mac OS X machine to perform disk backups?","o":["Disk Utility","Deja Dup","Finder","Time Machine"],"a":[3],"e":"","s":"Time Machine is an automatic backup utility in the Mac OS. The Mac Disk Utility allows an administrator to configure disk backups. The Deja Dup tool is a tool built into the Linux OS for backing up data. Finder is similar to the Windows File Explorer tool and is used to navigate the Mac OS file system."},{"i":"275","g":7,"q":"A user calls the help desk reporting that a laptop with Linux freezes on startup and displays kernel panic. What could cause this problem?","o":["A driver has become corrupted.","GRUB or LILO has been deleted.","GRUB or LILO has been corrupted.","An application is using a resource that has become unavailable."],"a":[0],"e":"","s":"A corrupted driver or failing hardware could cause kernel panic for Linux or Mac OS. The laptop will not be able to boot successfully. Either GRUB or LILO corruption or GRUB or LILO deletion would cause the stop screen to display a “Missing GRUB” or “Missing LILO” message. A resource unavailable to an application will cause the application to stop responding, but not prevent a laptop from starting up."},{"i":"276","g":7,"q":"A user calls the help desk to report that a mobile device exhibits very slow performance. What could cause this problem?","o":["The touchscreen is not calibrated.","An app is not compatible with the device.","The operating system is corrupt.","A power-intensive app is running in the background."],"a":[3],"e":"","s":"A power-intensive app that is running in the background could consume most of the CPU cycles and thus the device would exhibit very slow performance for other apps. If an app is not compatible with the device, the device operating system would freeze. If the operating system has encountered an error, the device will fail to respond."},{"i":"277","g":8,"q":"Which term describes a partition that is used to store and boot an operating system by default?","o":["logical drive","active partition","basic disk","extended partition"],"a":[1],"e":"Активный раздел хранит загрузчик и ОС по умолчанию.","s":""},{"i":"278","g":8,"q":"Which term describes a file system that supports a partition size up to 16 exabytes?","o":["extended partition","NTFS","logical drive","active partition"],"a":[1],"e":"NTFS поддерживает разделы до 16 эксабайт.","s":""},{"i":"279","g":8,"q":"Which term describes a file system for USB flash drives that supports files larger than 4 GB?","o":["extended partition","exFAT","logical drive","active partition"],"a":[1],"e":"exFAT подходит для флешек и поддерживает файлы больше 4 ГБ.","s":""},{"i":"280","g":8,"q":"Which term describes a partition that supports up to 23 logical drives?","o":["logical drive","extended partition","basic disk","active partition"],"a":[1],"e":"Расширенный раздел может содержать до 23 логических дисков.","s":""},{"i":"281","g":8,"q":"Which term describes a file system for optical disk media?","o":["extended partition","CDFS","logical drive","active partition"],"a":[1],"e":"CDFS — файловая система оптических дисков.","s":""},{"i":"282","g":8,"q":"Which term describes a type of partition that would only exist on a hard disk that has an MBR?","o":["extended partition","logical drive","basic disk","active partition"],"a":[0],"e":"Расширенные разделы бывают только на дисках с MBR.","s":""},{"i":"283","g":8,"q":"Which term describes a type of storage device that supports a partition to be extended into adjacent unallocated space as long as it is contiguous?","o":["NTFS","basic disk","FAT32","formatting"],"a":[1],"e":"Basic disk позволяет расширить раздел только в смежное свободное пространство.","s":""},{"i":"284","g":8,"q":"Which term describes a general name for physical areas on a hard drive?","o":["NTFS","partition","FAT32","formatting"],"a":[1],"e":"Partition (раздел) — общее название физических областей диска.","s":""},{"i":"285","g":8,"q":"Which term describes a partition scheme that takes a portion of disk space of 512 bytes long and that contains the boot loader?","o":["NTFS","MBR","FAT32","formatting"],"a":[1],"e":"MBR — первые 512 байт диска с загрузчиком и таблицей разделов.","s":""},{"i":"286","g":8,"q":"Which term describes a type of storage device that supports a volume that can span across more than one disk?","o":["NTFS","dynamic disk","FAT32","formatting"],"a":[1],"e":"Динамический диск позволяет создавать тома, охватывающие несколько дисков.","s":""},{"i":"287","g":9,"q":"A technician is booting a laptop that has Windows 10 installed with 2 GB RAM. The boot process is currently working on the following step: NTOSKRNL.EXE starts the login file called WINLOGON.EXE. What is the next step that will happen in the boot process?","o":["WINLOGON.EXE displays the Windows Welcome screen.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","Winload uses the path specified in BOOTMGR to find the boot partition."],"a":[0],"e":"Правильный следующий шаг: «WINLOGON.EXE displays the Windows Welcome screen.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":""},{"i":"288","g":9,"q":"A user is booting a tablet that has Windows 10 installed. The boot process is currently working on the following step: WINLOGON.EXE displays the Windows Welcome screen What is the next step that will happen in the boot process?","o":["There are no more steps, the boot process is complete.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","Winload uses the path specified in BOOTMGR to find the boot partition."],"a":[0],"e":"Правильный следующий шаг: «There are no more steps, the boot process is complete.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"The Windows 10 boot process is as follows: 1 . PreBoot: POST or Power-On Self-Test loads firmware settings. It checks for a valid disk system, and if the system is good to go for the next phase. If the computer has a valid MBR, i.e. Master Boot Record, the boot process moves further and loads Windows Boot Manager. 2 . Windows Boot Manager: This step determines if you have multiple OS installed on your computer. If yes, then it offers a menu with the names of the OSs. When you select the OS, it will load the right program, i.e. Winload.exe to boot you into the correct OS. 3 . Windows OS Loader: WinLoad.exe loads important drivers to kick start the Windows Kernel. The kernel uses the drivers to talk to the hardware and do rest of the things required for the boot process to continue. 4 . Windows NT OS Kernel: This is the last stage which picks up the Registry settings, additional drivers, etc. Once that has been read, the control is taken by the system manager process. It loads up the UI, the rest of the hardware and software. That’s when you finally get to see your Windows 10 Login screen"},{"i":"289","g":9,"q":"A manager is booting a tablet that has Windows 8 installed. The boot process is currently working on the following step: POST. What is the next step that will happen in the boot process?","o":["BIOS locates and reads the configuration settings that are stored in the CMOS memory.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","The Windows kernel takes over the boot process.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL."],"a":[0],"e":"Правильный следующий шаг: «BIOS locates and reads the configuration settings that are stored in the CMOS memory.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"Boot Sequence for Windows: – Power on Self Test (POST) – POST for each adapter card that has a BIOS – BIOS reads the MBR – MBR takes over control of the boot process and starts BOOTMGR – BOOTMGR reads the Boot Configuration Data file to know which OS to load and where to find the OS on the boot partition – BOOTMGR invokes WINLOAD.EXE in order to load the NTOSKRNL.EXE file and HAL.DLL – BOOTMGR reads the registry files and loads device drivers – NTOSKRNL.EXE starts the WINLOGON.EXE program and displays the Windows login screen."},{"i":"290","g":9,"q":"An accountant is booting a PC that has Windows 8 installed. The boot process is currently working on the following step: BIOS locates and reads the configuration settings that are stored in the CMOS memory. What is the next step that will happen in the boot process?","o":["The BIOS boots the computer using the first drive that contains a valid boot sector.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","The Windows kernel takes over the boot process.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL."],"a":[0],"e":"Правильный следующий шаг: «The BIOS boots the computer using the first drive that contains a valid boot sector.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"The Windows 10 boot process is as follows: 1 . PreBoot: POST or Power-On Self-Test loads firmware settings. It checks for a valid disk system, and if the system is good to go for the next phase. If the computer has a valid MBR, i.e. Master Boot Record, the boot process moves further and loads Windows Boot Manager. 2 . Windows Boot Manager: This step determines if you have multiple OS installed on your computer. If yes, then it offers a menu with the names of the OSs. When you select the OS, it will load the right program, i.e. Winload.exe to boot you into the correct OS. 3 . Windows OS Loader: WinLoad.exe loads important drivers to kick start the Windows Kernel. The kernel uses the drivers to talk to the hardware and do rest of the things required for the boot process to continue. 4 . Windows NT OS Kernel: This is the last stage which picks up the Registry settings, additional drivers, etc. Once that has been read, the control is taken by the system manager process. It loads up the UI, the rest of the hardware and software. That’s when you finally get to see your Windows 10 Login screen."},{"i":"291","g":9,"q":"A network analyst is booting a PC that has Windows 7 installed with 2 GB RAM. The boot process is currently working on the following step: The code in the boot sector is executed and the control of the boot process is given to Windows Boot Manager. What is the next step that will happen in the boot process?","o":["Winload uses the path specified in BOOTMGR to find the boot partition.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","The Windows kernel takes over the boot process.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL."],"a":[0],"e":"Правильный следующий шаг: «Winload uses the path specified in BOOTMGR to find the boot partition.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → чит  Kernel: This is the last stage which picks up the Registry settings, additional drivers, etc. Once that has been read, the control is taken by the system manager process. It loads up the UI, the rest of the hardware and software. That’s when you finally get to see your Windows 10 Login screen."},{"i":"297","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that the attacker was using a specific technique that affected the TCP three-way handshake. What is the type of network attack?","o":["DDoS","SYN flood","DNS poisoning","zero-day"],"a":[1],"e":"SYN flood использует трёхстороннее рукопожатие TCP: атакующий засыпает сервер SYN-запросами.","s":"The TCP SYN flood attack exploits the TCP three-way handshake. The threat actor continually sends TCP SYN session request packets with a randomly spoofed source IP address to an intended target."},{"i":"298","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that the attacker is using a technique that compares hashed passwords to potential hashes the hacker has. What is the type of network attack?","o":["rainbow table","DDoS","DNS poisoning","SYN flood"],"a":[0],"e":"Rainbow table сравнивает хеши паролей с заранее вычисленными хешами.","s":""},{"i":"299","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that the DNS server was sent with an enormous amount of false requests, thus overwhelming the server. What is the type of network attack?","o":["DNS poisoning","SYN flood","DoS","zero-day"],"a":[2],"e":"DoS перегружает службу огромным количеством ложных запросов.","s":""},{"i":"300","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that the attacker is using a vulnerability that is known to the software vendor, but not patched yet. What is the type of network attack?","o":["zero-day","DDoS","DNS poisoning","SYN flood"],"a":[0],"e":"Zero-day — уязвимость, известная вендору, но ещё не исправленная.","s":""},{"i":"301","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that zombies were used to attack the firewall. What is the type of network attack?","o":["DDoS","DNS poisoning","SYN flood","zero-day"],"a":[0],"e":"DoS перегружает службу огромным количеством ложных запросов.","s":""},{"i":"302","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that zombies were used to attack the firewall. What is the type of network attack?","o":["zero-day","dictionary","SYN flood","DDoS"],"a":[3],"e":"DoS перегружает службу огромным количеством ложных запросов.","s":""},{"i":"303","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that the attacker is using a table of words that potentially could be used as passwords. What is the type of network attack?","o":["dictionary","SYN flood","zero-day","DNS poisoning"],"a":[0],"e":"Dictionary — перебор паролей по списку вероятных слов.","s":""},{"i":"304","g":12,"q":"Users in a company have complained about network performance. After investigation, the IT staff has determined that the attacker injected false records on the server that translates IP addresses to domain names. What is the type of network attack?","o":["zero-day","DNS poisoning","dictionary","SYN flood"],"a":[1],"e":"DNS poisoning — подмена записей на сервере, сопоставляющем имена с IP.","s":""},{"i":"305","g":7,"q":"What is required as an additional verification mechanism on iOS mobile devices when setting up biometric screen locks, such as Touch ID or Face ID?","o":["a passcode","a swipe code","a linked email account","a pattern lock"],"a":[0],"e":"","s":"When setting up Touch ID and Face ID, you need to enter your passcode, or to create a passcode if one is not previously set up. The passcode will be used as an alternative manner to verify your identity."},{"i":"306","g":1,"q":"Which situation can be prevented by creating a UEFI password?","o":["malware installing a keystroke logger to collect user login credentials","an unauthorized person acting as the logged in user on an unlocked computer","a hacker using a password obtained through phishing to access network data","an unauthorized person changing the boot order on the computer to boot to another OS"],"a":[3],"e":"Пароль UEFI не позволит постороннему изменить порядок загрузки и запустить другую ОС.","s":""},{"i":"307","g":4,"q":"A PC technician has been asked by a supervisor to recommend a security solution for a company that wants a device to monitor incoming and outgoing traffic and stop any malicious activity. Which security technique should the technician recommend?","o":["Buy an IPS.","Implement a RAID.","Provide security awareness training.","Use SSL."],"a":[0],"e":"IPS отслеживает входящий и исходящий трафик и блокирует вредоносную активность.","s":""},{"i":"308","g":8,"q":"A PC technician has been asked by a supervisor to recommend a security solution for a machine where the antimalware software cannot remove all of the malware. Which security technique should the technician recommend?","o":["Implement a RAID.","Provide security awareness training.","Use Windows Safe Mode.","Use encryption."],"a":[2],"e":"Безопасный режим не загружает большинство драйверов, поэтому остатки вредоносного ПО проще удалить.","s":""},{"i":"309","g":12,"q":"A PC technician has been asked by a supervisor to recommend a security solution for preventing tailgating. Which security technique should the technician recommend?","o":["Use a mantrap.","Implement a RAID.","Provide security awareness training.","Use encryption."],"a":[0],"e":"Mantrap (шлюз-тамбур) не пускает «паровозом» (tailgating).","s":""},{"i":"310","g":1,"q":"A PC technician has been asked by a supervisor to recommend a security solution for drive redundancy. Which security technique should the technician recommend?","o":["Buy an ASA.","Use a VPN.","Implement dual authentication.","Implement a RAID."],"a":[3],"e":"RAID обеспечивает избыточность дисков.","s":""},{"i":"311","g":12,"q":"A PC technician has been asked by a supervisor to recommend a security solution for phishing. Which security technique should the technician recommend?","o":["Provide security awareness training.","Buy an ASA.","Use a VPN.","Employ ping sweeps."],"a":[0],"e":"Обучение сотрудников — главная защита от фишинга.","s":""},{"i":"312","g":1,"q":"A PC technician has been asked by a supervisor to recommend a security solution for protecting a computer used to log in at a dental clinic from someone using a bootable disk containing hacking tools. Which security technique should the technician recommend?","o":["Buy an ASA.","Use a VPN.","Run vulnerability scanners.","Disable ports."],"a":[3],"e":"Отключение портов (USB/загрузка) и пароль BIOS защищают от запуска с чужого загрузочного диска.","s":""},{"i":"313","g":4,"q":"A PC technician has been asked by a supervisor to recommend a security solution for a manager traveling who needs access to internal corporate resources. Which security technique should the technician recommend?","o":["Buy an ASA.","Use a VPN.","Disable ports.","Run vulnerability scanners."],"a":[1],"e":"VPN даёт безопасный доступ к ресурсам компании из любой точки.","s":""},{"i":"314","g":10,"q":"Why would a gamer need to use the move command?","o":["to relocate a file from one Windows directory to another one","to prepare a hard drive to accept Windows files","to manage a PCs drives, disks, partitions, volumes, and virtual drives","to copy files, directories, and subdirectories from one location to another"],"a":[0],"e":"move перемещает файл из одного каталога в другой (в старом месте его не остаётся).","s":""},{"i":"315","g":10,"q":"Why would a gamer need to use the copy command?","o":["to move that file to a different Windows directory while also leaving the file in the current location","to prepare a hard drive to accept Windows files","to manage a PCs drives, disks, partitions, volumes, and virtual drives","to copy files, directories, and subdirectories from one location to another"],"a":[3],"e":"copy копирует файлы из одного места в другое.","s":""},{"i":"316","g":10,"q":"Why would a university student need to use the robocopy command?","o":["to copy a group of files from one Windows directory to another","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to shutdown several remote computers one at a time","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system"],"a":[0],"e":"robocopy — мощное копирование групп файлов и каталогов.","s":""},{"i":"317","g":10,"q":"Why would a university student need to use the xcopy command?","o":["to copy files, directories, and subdirectories from one location to another","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to shutdown several remote computers one at a time","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system"],"a":[0],"e":"xcopy копирует файлы, каталоги и подкаталоги.","s":""},{"i":"318","g":10,"q":"Why would a technical support representative need to use the format command?","o":["to prepare a hard drive to accept Windows files","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to shutdown several remote computers one at a time","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system"],"a":[0],"e":"format подготавливает диск к приёму файлов Windows (создаёт файловую систему).","s":""},{"i":"319","g":10,"q":"Why would a technical support representative need to use the bootrec command?","o":["to help to repair the MBR that is suspected of having issues","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to shutdown several remote computers one at a time","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system"],"a":[0],"e":"bootrec помогает восстановить MBR и загрузочные записи.","s":""},{"i":"320","g":4,"q":"Why would a technical support representative need to use the ipconfig command?","o":["to display the IPv6 address of the PC","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to shutdown several remote computers one at a time","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system"],"a":[0],"e":"ipconfig показывает IP-конфигурацию, в том числе IPv6-адрес.","s":""},{"i":"321","g":10,"q":"Why would a user need to use the netstat command?","o":["to verify activity on the PC by displaying all active TCP connections on the device","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to shutdown several remote computers one at a time","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system"],"a":[0],"e":"netstat показывает активные TCP-подключения.","s":""},{"i":"322","g":10,"q":"Why would a user need to use the nslookup command?","o":["to query the Domain Name Sysytem (DNS) to get domain names and mapping information","to scan and verify the integrity of all protected system files and replace incorrect versions with correct versions","to shutdown several remote computers one at a time","to repair, prepare, and fix Windows images and the recovery image within an installation of the operating system"],"a":[0],"e":"nslookup запрашивает DNS и показывает соответствие имён и адресов.","s":""},{"i":"323","g":4,"q":"Why would a manager need to use the ping command?","o":["to quickly verify connectivity by sending echo-request messages to the destination and receiving a series of echo-reply messages from that destination","to change from the current working folder to another folder","to create a new Windows directory","to remove an empty directory"],"a":[0],"e":"ping отправляет echo-запросы и проверяет доступность узла.","s":""},{"i":"324","g":4,"q":"What are two probable causes of a user unable to access local resources such as file shares or printers on a wired network? (Choose two.)","o":["bad cabling","DNS name resolution not working","ISP down","incorrect gateway address","poor Wi-Fi signal"],"a":[0,1],"e":"","s":"There are many issues which can cause local resources to be unavailable. These include bad cabling, a switch or router not functioning, a firewall blocking traffic, DNS name resolution not working, or failed services."},{"i":"325","g":12,"q":"The IT department has just purchased 15 wireless access points in order to provide full wireless coverage for all 100 employees within the company and is looking to deploy the most secure and scalable wireless implementation. Which open source authentication method would perform authentication on behalf of all 15 wireless network devices?","o":["TACACS+","TKIP","RADIUS","WPA2-PSK"],"a":[2],"e":"","s":"RADIUS and TACACS+ both use a separate server that performs authentication on behalf of network devices. However, RADIUS is an open standard and provides greater compatibility."},{"i":"326","g":1,"q":"A technician is upgrading many PCs used within the company. How should the technician dispose of an old inkjet printer cartridge?","o":["Recycle following local regulations.","Give it to your neighbor.","Take it home.","Seal in a plastic bag before putting in the garbage."],"a":[0],"e":"Электроника содержит токсичные материалы (свинец, ртуть, кадмий), поэтому её нельзя выбрасывать или сжигать — только переработка по местным правилам.","s":""},{"i":"327","g":0,"q":"A technician is about to begin preventive maintenance on a company PC. In which situation would ESD be an issue?","o":["when walking across a carpeted area and then touching a keyboard that is attached to a tower PC","when installing a UPS","while attaching speakers to a surround sound card","when installing a processor"],"a":[0],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":""},{"i":"328","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 67. What service application is the client requesting?","o":["DHCP","SSH","Telnet","SMTP"],"a":[0],"e":"Порт 67 — DHCP — автоматическая выдача IP (сервер, порт 67).","s":""},{"i":"329","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 443. What service application is the client requesting?","o":["HTTPS","SSH","Telnet","SMTP"],"a":[0],"e":"Порт 443 — HTTPS — защищённый веб.","s":""},{"i":"330","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 69. What service application is the client requesting?","o":["TFTP","SSH","Telnet","SMTP"],"a":[0],"e":"Порт 69 — TFTP — простая передача файлов (UDP).","s":""},{"i":"331","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 445. What service application is the client requesting?","o":["SMB/CIFS","SSH","Telnet","SMTP"],"a":[0],"e":"Порт 445 — SMB/CIFS — общий доступ к файлам и принтерам Windows.","s":""},{"i":"332","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 548. What service application is the client requesting?","o":["AFP","HTTP","TFTP","POP3"],"a":[0],"e":"Порт 548 — AFP — файловый доступ Apple.","s":""},{"i":"333","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 80. What service application is the client requesting?","o":["HTTP","POP3","TFTP","NetBIOS (NetBT)"],"a":[0],"e":"Порт 80 — HTTP — веб.","s":""},{"i":"334","g":3,"q":"A client packet is received by a server. The packet has a destination port number of 3389. What service application is the client requesting?","o":["RDP","HTTP","TFTP","POP3"],"a":[0],"e":"Порт 3389 — RDP — удалённый рабочий стол Windows.","s":""},{"i":"335","g":10,"q":"Why would a user need to use the gpupdate command?","o":["to change from the current working folder to another folder","to verify the settings that are suspected to be incorrect","to make the PC synchronize with new group policy settings","to create a new Windows directory"],"a":[2],"e":"gpupdate принудительно применяет новые параметры групповой политики.","s":""},{"i":"336","g":3,"q":"Which protocol is used by Windows for file and printer sharing?","o":["SMB","SMTP","HTTPS","IMAP"],"a":[0],"e":"","s":"SMB (Server Message Block) is the protocol used for file and printer sharing by Windows. SMTP and IMAP are protocols used in email services. HTTPS is the protocol used for secure web browsing."},{"i":"337","g":5,"q":"Which laptop LCD technology uses tilting crystals to provide a much higher contrast ratio than other types?","o":["Vertical alignment (VA)","In-Plane switching (IPS)","Twisted Nematic (TN)","Organic light-emitting diode (OLED)"],"a":[0],"e":"","s":"Vertical alignment (VA) laptop display technology uses tilting crystals to provide a much higher contrast ratio than other types. In-Plane switching (IPS) and Twisted Nematic (TN) do not have this feature. Organic light-emitting diode (OLED) displays are not used in laptops."},{"i":"338","g":8,"q":"Which two statements are true regarding GPT partitions? (Choose two.)","o":["They are commonly used in computers with UEFI firmware.","They are commonly used in computers with BIOS based firmware.","They store a backup of the partition table.","They have a maximum partition size of 2TB.","They store the partition and boot data in one place."],"a":[0,2],"e":"","s":"GPT partitions are commonly used in computers with UEFI firmware. They store a backup of the partition table and can support up to 128 partitions. The maximum partition size is 9.4ZB."},{"i":"339","g":8,"q":"A technician wishes to use the reset option to repair a Windows 10 installation and chooses the option that will retain the user’s personal files. Which statement is true based on using this option?","o":["All user files and applications will be restored together with the complete reinstallation of Windows 10.","Only user files will be restored together with the complete reinstallation of Windows 10.","All user files and applications will be deleted, and a complete reinstallation of Windows 10 will occur.","Only corrupt files of the Windows 10 installation will be replaced and repaired."],"a":[1],"e":"","s":"By using the reset process from within the recovery area, it will remove all apps and programs, change the computer’s settings back to their defaults, and reinstall Windows 10 without removing any user personal data files."},{"i":"340","g":11,"q":"A user is trying to execute a file using elevated permission. The user right-clicks the file, chooses Run as Administrator, and chooses Yes in the User Account Control (UAC) window. The operation fails. What is the reason?","o":["The UAC does not have the elevated privileges option.","The user is not a member of the administrator group.","The directory housing the file is read-only.","The login password of the user is invalid."],"a":[1],"e":"","s":"An administrator password is required to open or execute a file using elevated permission, or the current user must belong to the Administrator group."},{"i":"341","g":8,"q":"What is a possible situation when it might be necessary to boot Windows 10 from a bootable recovery USB device?","o":["to disable background services","to delete registry keys","to partition the hard drive","to repair the operating system"],"a":[3],"e":"","s":"You can boot Windows 10 from a repair boot USB drive and repair your computer with corresponding recovery tools, such as bootrec commands. A Windows 10 repair boot USB is a bootable recovery drive made with USB."},{"i":"342","g":9,"q":"An accountant is booting a PC that has Windows 10 installed. The boot process is currently working on the following step: BIOS locates and reads the configuration settings that are stored in the CMOS memory. What is the next step that will happen in the boot process?","o":["The BIOS boots the computer using the first drive that contains a valid boot sector.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","The Windows kernel takes over the boot process.","WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL."],"a":[0],"e":"Правильный следующий шаг: «The BIOS boots the computer using the first drive that contains a valid boot sector.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"The Windows 10 boot process is as follows: 1 . PreBoot: POST or Power-On Self-Test loads firmware settings. It checks for a valid disk system, and if the system is good to go for the next phase. If the computer has a valid MBR, i.e. Master Boot Record, the boot process moves further and loads Windows Boot Manager. 2 . Windows Boot Manager: This step determines if you have multiple OS installed on your computer. If yes, then it offers a menu with the names of the OSs. When you select the OS, it will load the right program, i.e. Winload.exe to boot you into the correct OS. 3 . Windows OS Loader: WinLoad.exe loads important drivers to kick start the Windows Kernel. The kernel uses the drivers to talk to the hardware and do rest of the things required for the boot process to continue. 4 . Windows NT OS Kernel: This is the last stage which picks up the Registry settings, additional drivers, etc. Once that has been read, the control is taken by the system manager process. It loads up the UI, the rest of the hardware and software. That’s when you finally get to see your Windows 10 Login screen."},{"i":"343","g":9,"q":"A manager is booting a tablet that has Windows 10 installed. The boot process is currently working on the following step: The Windows kernel takes over the boot process. What is the next step that will happen in the boot process?","o":["NTOSKRNL.EXE starts the login file called WINLOGON.EXE.","The Windows kernel takes over the boot process.","WinLoad reads the registry files, chooses a hardware profile, and loads the device drivers.","WINLOGON.EXE displays the Windows Welcome screen"],"a":[0],"e":"Правильный следующий шаг: «NTOSKRNL.EXE starts the login file called WINLOGON.EXE.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"The Windows 10 boot process is as follows: 1. PreBoot: POST or Power-On Self-Test loads firmware settings. It checks for a valid disk system, and if the system is good to go for the next phase. If the computer has a valid MBR, i.e. Master Boot Record, the boot process moves further and loads Windows Boot Manager. 2. Windows Boot Manager: This step determines if you have multiple OS installed on your computer. If yes, then it offers a menu with the names of the OSs. When you select the OS, it will load the right program, i.e. Winload.exe to boot you into the correct OS. 3. Windows OS Loader: WinLoad.exe loads important drivers to kick start the Windows Kernel. The kernel uses the drivers to talk to the hardware and do rest of the things required for the boot process to continue. 4. Windows NT OS Kernel: This is the last stage which picks up the Registry settings, additional drivers, etc. Once that has been read, the control is taken by the system manager process. It loads up the UI, the rest of the hardware and software. That’s when you finally get to see your Windows 10 Login screen."},{"i":"344","g":9,"q":"An analyst is booting a desktop that has Windows 10 installed with 4 GB RAM. The boot process is currently working on the following step: Winload uses the path specified in BOOTMGR to find the boot partition. What is the next step that will happen in the boot process?","o":["WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.","The BIOS boots the computer using the first drive that contains a valid boot sector.","The code in the boot sector is executed and the control of the boot process is given to Windows Boot Manager.","The Windows kernel takes over the boot process."],"a":[0],"e":"Правильный следующий шаг: «WinLoad loads two files that make up the core of Windows: NTOSKRNL.EXE and HAL.DLL.». Порядок загрузки Windows: POST → BIOS читает настройки CMOS → загрузка с первого диска с валидным загрузочным сектором → Windows Boot Manager → Winload находит загрузочный раздел → Winload загружает NTOSKRNL.EXE и HAL.DLL → читает реестр, профиль оборудования и драйверы → ядро берёт управление → NTOSKRNL запускает WINLOGON.EXE → экран приветствия.","s":"The Windows 10 boot process is as follows: 1. PreBoot: POST or Power-On Self-Test loads firmware settings. It checks for a valid disk system, and if the system is good to go for the next phase. If the computer has a valid MBR, i.e. Master Boot Record, the boot process moves further and loads Windows Boot Manager. 2. Windows Boot Manager: This step determines if you have multiple OS installed on your computer. If yes, then it offers a menu with the names of the OSs. When you select the OS, it will load the right program, i.e. Winload.exe to boot you into the correct OS. 3. Windows OS Loader: WinLoad.exe loads important drivers to kick start the Windows Kernel. The kernel uses the drivers to talk to the hardware and do rest of the things required for the boot process to continue. 4. Windows NT OS Kernel: This is the last stage which picks up the Registry settings, additional drivers, etc. Once that has been read, the control is taken by the system manager process. It loads up the UI, the rest of the hardware and software. That’s when you finally get to see your Windows 10 Login screen"},{"i":"345","g":8,"q":"A user notes that the username and password are automatically populated in the Microsoft Edge browser when logging into a secure site. When the user tries to log into the same site using Google Chrome, the username and password do not save automatically. Why is this occurring?","o":["Google Chrome does not support that secure site.","The certificate for that site has not been authenticated.","Google Chrome does not automatically save web credentials.","The Google Chrome browser is corrupt."],"a":[2],"e":"","s":"Web credentials do not save for sites accessed by browsers other than Internet Explorer and Edge. Credentials created with other browsers must be managed from within that browser."},{"i":"346","g":11,"q":"Which statement is true regarding libraries in Windows 10?","o":["Libraries allow Windows 10 to support file names longer than 20 characters.","Libraries allow Windows 10 to link multiple different directories.","Libraries allow Windows 10 to enforce the EFS file system.","Libraries allow Windows 10 to index files faster."],"a":[1],"e":"","s":"Libraries in Windows 10 allow multiple different directories to be linked together in one location."},{"i":"350","g":12,"q":"A corporation would like to use three or more factors for the password authentication policy. How can this be achieved?","o":["2FA","SFA","bitlocker","MFA"],"a":[3],"e":"","s":"MFA (Multi-Factor Authentication) requires users to present at least two, if not more, types of authentication. 2FA (Two-Factor authentication), also sometimes referred to as 2-step verification, is a security approach requiring users to present two factors for authentication for accessing an account. SFA (Single-Factor Authentication) requires users to authenticate with only one type of evidence for authentication, usually a password. Bitlocker encrypts drives."},{"i":"351","g":0,"q":"A person has started a new technical job. In which situation would ESD be an issue?","o":["while exchanging one laptop AC adapter with one that is not from the original equipment manufacturer","when using a grounded mat and working on a computer on an ungrounded workbench","when replacing a motherboard","when installing a dual-voltage power supply"],"a":[2],"e":"ESD (электростатический разряд) опасен при работе с внутренними компонентами — RAM, процессором, платами — и при накоплении заряда (ковёр + касание корпуса). Заземлённый коврик на незаземлённом столе защиту не даёт.","s":"Post navigation ← Previous Article IT Essentials 7.0 8.0 Practice Final Exam (Chapters 1-9) Answers Full Next Article → IT Essentials (ITE v5.0 & v5.02) A+ Cert Practice Exam 1 Test online 100% 2019 About The Author ITExam Editorial Team The ITExamAnswers Editorial Team is a dedicated group of certified IT professionals and network engineers. We rigorously review, verify, and update all exam materials to ensure you receive the most accurate and reliable resources for your certification journey. Subscribe guest 600 {}[+] 203 Corrections & Clarifications View Comments"} let P={st:{},best:{},mock:[],cards:{},w:0,th:null};
const MEM={};const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}};

const byId={};QS.forEach(q=>byId[q.i]=q);
